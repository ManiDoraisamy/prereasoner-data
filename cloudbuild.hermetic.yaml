# Full hermetic project suite against the already-built, digest-pinned CPU serving image.
# Live Postgres/world and external orchestrator suites are intentionally separate gates.
steps:
  - id: hermetic-suite
    name: gcr.io/cloud-builders/docker@sha256:e85f8f20f7b533e74a4b1be279b9ff2b45dcc20ab97de9b302c26715a9d9ffc8
    entrypoint: bash
    args:
      - -ceu
      - |
        node_volume=prereasoner-node-bin
        docker volume create "$$node_volume" >/dev/null
        docker run --rm --volume "$$node_volume:/node" node:22-bookworm-slim \
          sh -ceu 'cp "$(command -v node)" /node/node; chmod 0555 /node/node'
        docker run --rm --volume "$$node_volume:/node:ro" node:22-bookworm-slim /node/node --version
        docker run --rm --cpus=8 --memory=16g \
          --volume "$$node_volume:/opt/node:ro" \
          --volume /workspace:/workspace:ro \
          --workdir /app \
          --env PATH=/opt/node:/opt/venv/bin:/usr/local/bin:/usr/bin:/bin \
          --env RUN_ENGINE_TESTS=0 \
          --env RUN_ORCHESTRATOR_TESTS=0 \
          --entrypoint /bin/sh \
          ${_BASE_IMAGE} /workspace/deploy/gcp/run_hermetic_suite.sh

substitutions:
  _BASE_IMAGE: us-central1-docker.pkg.dev/prereasoner-inference/prereasoner/engine@sha256:57d49a5da4e5ec2fa03881969e9424bb5032584aaf94bc581b6bbfc74aeb8482

options:
  machineType: E2_HIGHCPU_8

timeout: 3600s
