# Build + push the engine image to Artifact Registry.
#
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_REGION=us-central1,_REPO=prereasoner,_TAG=latest
#
# Run this BEFORE `terraform apply` (Terraform's Cloud Run service consumes the pushed
# tag via the `image` variable / its default). Full walkthrough: infra/README.md.
#
# NOTE: the model weights in engine/data/ are gitignored, and WITHOUT a .gcloudignore
# `gcloud builds submit` would derive its upload ignore list from .gitignore — silently
# shipping a weights-less image that dies at startup. The repo-root .gcloudignore exists
# precisely to keep engine/data/ in the upload; do not delete it.

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    env:
      - DOCKER_BUILDKIT=1 # the Dockerfile uses a COPY heredoc (entrypoint) — BuildKit-only
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/engine:${_TAG}
      - .

  # REGRESSION GATE (offline tier) — runs the golden non-world text-to-SQL cases + engine.joins invariants
  # INSIDE the freshly built image (real Qwen/LoRA weights are baked in; no Postgres needed). A regression
  # here FAILS the build, so the image below is never pushed. This is the gate that would have caught the
  # FK-miss + integer-year regressions. See regress/run_regression.py.
  - id: regress-offline
    name: gcr.io/cloud-builders/docker
    waitFor: ['build']
    args:
      - run
      - --rm
      - --entrypoint
      - python
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/engine:${_TAG}
      - -m
      - regress.run_regression
      - --offline
  # WORLD tier (the world-model-join goldens + tests/ oracle suites) needs the seeded world Postgres. Wire it
  # by connecting Cloud SQL (add the cloud-sql-proxy sidecar or _CLOUDSQL substitution) and passing
  # WORLD_PG_PASSWORD from Secret Manager, then run `python -m regress.run_regression --require-world`
  # (tests/ must also be added to the image / .gcloudignore for the reused oracle suites). Until wired, the
  # world tier must be run pre-deploy against a seeded DB (dev or staging). Skipped != passed.

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/engine:${_TAG}

substitutions:
  _REGION: us-central1 # must match infra/ var.region
  _REPO: prereasoner   # must match infra/ var.artifact_repo
  _TAG: latest

options:
  # The torch/transformers pip layer is the long pole; a bigger machine roughly halves it.
  machineType: E2_HIGHCPU_8

timeout: 2400s
