# PreReasoner local stack: Postgres (pgvector) + the serving engine.
#
#   cp .env.example .env            # set KB_PG_PASSWORD (defaults to "devpassword" if unset)
#   docker compose up --build       # db + engine on http://localhost:8080
#
# AUTH_TEST_SUB=localdev is set on the engine so reviewers can call /api/reason and
# /api/knowledge WITHOUT a Firebase ID token (test-only bypass; never set it in production).
# RTDB_URL is deliberately NOT set: trace streaming no-ops and responses carry full JSON.
#
# One-time database seed (~15-45 min, mostly Wikidata Query Service calls) - the engine
# resolves nothing until knowledgebase."words"/"types" are populated. The dedicated `seed`
# service bind-mounts ./db so sync caches persist on the host and reuses the engine image
# (its Python stack satisfies db/sync/requirements.txt). Run it once after `up`:
#
#   docker compose --profile seed run --rm seed
#
# For the full sync (settlement long tail + aliases; several hours) or per-type syncs,
# see db/README.md — e.g.:
#   docker compose --profile seed run --rm seed \
#     bash -c "python db/sync/sync_wikidata.py --reset && python db/sync/build_world.py && \
#              python db/sync/build_words.py --cities --city-aliases && python db/sync/sync_types.py"

services:
  db:
    image: pgvector/pgvector:pg16   # ships vector + pg_trgm (contrib) — all init.sql needs
    environment:
      POSTGRES_DB: world
      POSTGRES_PASSWORD: ${KB_PG_PASSWORD:-devpassword}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Applied automatically on FIRST start of an empty volume; idempotent if re-applied
      # manually later (docker compose exec -T db psql -U postgres -d world < db/init.sql).
      - ./db/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d world"]
      interval: 5s
      timeout: 5s
      retries: 20

  engine:
    build: .
    ports:
      - "8080:8080"
    environment:
      KB_PG_HOST: db
      KB_PG_PORT: "5432"
      KB_PG_DB: world
      KB_PG_USER: postgres
      KB_PG_PASSWORD: ${KB_PG_PASSWORD:-devpassword}
      KB_PG_SSLMODE: prefer        # docker Postgres has no SSL; prefer falls back cleanly
      APP_ENV: development
      AUTH_TEST_SUB: localdev         # local-only Firebase auth bypass — see header comment
      CORS_ORIGINS: http://localhost:8090,http://127.0.0.1:8090
      DEVICE: cpu
      # RTDB_URL intentionally unset — streaming no-ops locally.
    depends_on:
      db:
        condition: service_healthy

  # The Sonnet orchestrator + PreReasoner MCP server (docs/MCP.md). Calls the engine over the compose
  # network (ENGINE_BASE_URL=http://engine:8080), same way the engine reaches db. Needs ANTHROPIC_API_KEY
  # in .env. Local: chat UI + /chat on http://localhost:8090; the engine runs with AUTH_TEST_SUB so no
  # Firebase token is needed and RTDB is unset (the reasoning player rebuilds from the returned views).
  chat:
    profiles: ["chat"]
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    ports:
      - "8090:8090"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in .env}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      ENGINE_BASE_URL: http://engine:8080
      APP_ENV: development
      AUTH_TEST_SUB: localdev         # /chat requires a verified identity; local dev has no Google sign-in, so
                                      # the orchestrator uses the same bypass as the engine (refused on Cloud Run)
      CORS_ORIGINS: http://localhost:8090,http://127.0.0.1:8090
      ORCH_HOST: 0.0.0.0
      ORCH_PORT: "8090"
    depends_on:
      - engine

  # One-shot database seeder (profile "seed" keeps it out of `docker compose up`).
  # Reuses the engine image but overrides the entrypoint: seeding needs no model weights,
  # so it must not trip the engine's missing-weights startup gate.
  seed:
    profiles: ["seed"]
    build: .
    entrypoint: []
    working_dir: /app
    environment:
      KB_PG_HOST: db
      KB_PG_PORT: "5432"
      KB_PG_DB: world
      KB_PG_USER: postgres
      KB_PG_PASSWORD: ${KB_PG_PASSWORD:-devpassword}
      KB_PG_SSLMODE: prefer
      HF_HOME: /hf                    # persist the bge-small-en-v1.5 download between runs
    volumes:
      - ./db:/app/db                  # rw: sync_types.py refreshes db/sync/data/p279_cache.json
      - hfcache:/hf
    depends_on:
      db:
        condition: service_healthy
    # Minimal seed (db/README.md §3): countries/currencies/elements + cities pop>=100k,
    # friendly world tables, the pgvector words index (+HNSW), and the type taxonomy.
    command: >
      bash -c "python db/sync/sync_wikidata.py --reset --high-only
               && python db/sync/build_world.py
               && python db/sync/build_words.py --cities
               && python db/sync/sync_types.py
               && python db/sync/unify_words_qid.py
               && python -m db.sync.build_u_s_state
               && python -m db.sync.app_migrations"

volumes:
  pgdata:
  hfcache:
