<!DOCTYPE html>
<html>
  <head>
    <base target="_blank">
    <link rel="stylesheet" href="https://ssl.gstatic.com/docs/script/css/add-ons1.css">
    <style>
      html, body { height: 100%; }
      body { margin: 0; color: #202124; font: 13px Arial, sans-serif; }
      .sidebar { box-sizing: border-box; height: 100%; padding: 0 16px 14px; overflow-y: auto; }
      .header { min-height: 45px; display: flex; align-items: center; border-bottom: 1px solid #dadce0; }
      .header .gray { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
      .status { padding: 18px 0; color: #5f6368; line-height: 1.5; }
      .status.error { color: #b31412; }
      .conversation {
        display: block;
        padding: 11px 4px;
        color: #202124;
        text-decoration: none;
        border-bottom: 1px solid #f1f3f4;
      }
      .conversation:hover { background: #f8f9fa; }
      .question { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .time { margin-top: 4px; color: #5f6368; font-size: 11px; }
    </style>
  </head>
  <body>
    <div class="sidebar">
      <div class="header"><span class="gray">Previous conversations</span></div>
      <div id="list" class="status">Loading…</div>
    </div>
    <script>
      var INITIAL_DATA = <?!= initialData ?>;
      var REASON_BASE = <?!= reasonBase ?>;
      (function () {
        var list = document.getElementById('list');
        function esc(value) {
          var node = document.createElement('div');
          node.textContent = value == null ? '' : String(value);
          return node.innerHTML;
        }
        function timestamp(value) {
          if (!value) return '';
          try { return new Date(value).toLocaleString(undefined, {month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'}); }
          catch (_) { return ''; }
        }
        function render(data) {
          list.innerHTML = '';
          if (!data || data.error) {
            list.className = 'status error';
            list.textContent = data && data.error ? data.error : 'Could not load previous conversations.';
            return;
          }
          var conversations = Array.isArray(data.conversations) ? data.conversations : [];
          if (!conversations.length) {
            list.className = 'status';
            list.textContent = 'Your previous conversations will appear here.';
            return;
          }
          conversations.forEach(function (conversation) {
            var id = String(conversation.id || '');
            if (!/^c_[0-9a-f]{32}$/i.test(id)) return;
            var link = document.createElement('a');
            link.className = 'conversation';
            link.href = REASON_BASE + encodeURIComponent(id);
            link.target = '_blank';
            link.rel = 'noopener';
            link.innerHTML = '<div class="question">' + esc(conversation.question || '(untitled)') + '</div>' +
              (conversation.ts ? '<div class="time">' + esc(timestamp(conversation.ts)) + '</div>' : '');
            link.addEventListener('click', function(event) {
              var target = window.open('about:blank', '_blank');
              if (!target) return;
              event.preventDefault();
              try { target.opener = null; } catch (_) {}
              var open = function() { target.location.href = link.href; };
              google.script.run.withSuccessHandler(open).withFailureHandler(open)
                .syncPrereasonerConversation({conversationId: id});
            });
            list.appendChild(link);
          });
        }
        render(INITIAL_DATA);
      }());
    </script>
  </body>
</html>
