<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link rel="stylesheet" href="https://ssl.gstatic.com/docs/script/css/add-ons1.css">
    <style>
      html, body { height: 100%; }
      body { margin: 0; color: #202124; font: 13px Arial, sans-serif; }
      .branding-below {
        bottom: 54px;
        top: 0;
        overflow-y: auto;
        padding: 0 16px 16px;
        box-sizing: border-box;
      }
      .topline {
        min-height: 52px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid #dadce0;
      }
      .new-chat {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 30px;
        box-sizing: border-box;
        border: 1px solid #dadce0;
        border-radius: 7px;
        background: #fff;
        color: #3c3154;
        padding: 0 9px;
        font: 400 12px/14px Arial, sans-serif;
        line-height: 14px;
        cursor: pointer;
      }
      .new-chat:hover { background: #f7f5fb; border-color: #c8bfd8; }
      .sync-meta { display: inline-flex; align-items: center; gap: 7px; color: #5f6368; font-size: 12px; white-space: nowrap; }
      .sync-state {
        min-height: 26px;
        box-sizing: border-box;
        border: 1px solid transparent;
        border-radius: 6px;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 0 7px;
        background: transparent;
        font: 500 11px/1 Arial, sans-serif;
        cursor: pointer;
      }
      .sync-state[hidden] { display: none; }
      .sync-state.current { color: #137a43; cursor: default; }
      .sync-state.checking { color: #7a5a16; cursor: default; }
      .sync-state.stale, .sync-state.error, .sync-state.session-error {
        color: #b3261e;
        background: #fff7f6;
        border-color: #f2b8b5;
      }
      .sync-state:not(:disabled):hover { background: #fce8e6; }
      .sync-glyph { font-weight: 700; }
      .context {
        padding: 11px 0 13px;
        color: #5f6368;
        border-bottom: 1px solid #f1f3f4;
      }
      .context[hidden] { display: none; }
      .context strong { color: #202124; font-weight: 500; }
      .status-error { color: #b31412; }
      .empty {
        padding: 26px 0;
        color: #5f6368;
        line-height: 1.5;
      }
      .restore-note {
        margin: 16px 0;
        padding: 11px;
        color: #5f6368;
        background: #f8f9fa;
        border: 1px solid #dadce0;
        border-radius: 8px;
        line-height: 1.45;
      }
      .restore-note strong { display: block; margin-bottom: 4px; color: #202124; font-weight: 500; }
      .turn { margin: 14px 0 18px; }
      .question {
        display: inline-block;
        max-width: 94%;
        margin-left: 6%;
        padding: 9px 11px;
        color: #4f2fd0;
        background: #f0ecfc;
        border-radius: 8px;
        line-height: 1.4;
        box-sizing: border-box;
      }
      .answer {
        margin-top: 8px;
        padding: 11px;
        background: #f8f9fa;
        border: 1px solid #dadce0;
        border-radius: 8px;
        line-height: 1.45;
        white-space: pre-wrap;
      }
      .answer a { color: #4f2fd0; text-decoration: underline; text-underline-offset: 2px; }
      .answer code { padding: 1px 4px; border-radius: 4px; background: #eceff1; font: 12px Consolas, monospace; }
      .answer.pending { color: #5f6368; }
      .answer.pending.has-reply { color: #202124; }
      .pending-status { color: #5f6368; }
      .streamed-reply { margin-top: 8px; color: #202124; }
      .answer.error { color: #8d1b15; background: #fce8e6; border-color: #f2b8b5; }
      .turn.recalculating { opacity: .65; }
      details.reasoning {
        margin-top: 8px;
        padding-top: 1px;
      }
      details.reasoning summary {
        padding: 6px 2px;
        color: #5f6368;
        cursor: pointer;
        list-style-position: inside;
      }
      .reasoning-title { color: #4b4167; font-weight: 500; }
      .reasoning-body { padding: 1px 0 4px; color: #5f6368; }
      .analysis-open { display: inline-block; margin: 1px 0 7px 24px; color: #4f2fd0; text-decoration: none; font-size: 11px; }
      .analysis-open:hover, .analysis-open:focus { text-decoration: underline; }
      .reasontree { display: flex; flex-direction: column; gap: 5px; }
      .reasonnode { position: relative; min-width: 0; }
      .branchhead { display: flex; align-items: flex-start; gap: 7px; padding: 4px 2px; color: #51486b; line-height: 1.35; }
      .branchmark { width: 7px; height: 7px; margin-top: 5px; border-radius: 50%; background: #8f7bf2; box-shadow: 0 0 0 3px #f0ecfd; flex: 0 0 auto; }
      .branchtxt { display: flex; flex-direction: column; min-width: 0; }
      .branchtxt b { color: #4b4167; font-weight: 600; }
      .branchq { margin-top: 1px; color: #8b829e; font-size: 11px; }
      .reasonchildren { margin-left: 10px; padding-left: 9px; border-left: 1px solid #ded8ee; }
      .reasonref { margin: 3px 0 3px 18px; color: #8b829e; font-size: 11px; }
      .branchsteps { display: flex; flex-direction: column; gap: 4px; margin: 2px 0 5px 14px; }
      .steplink {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        padding: 7px 8px;
        color: #202124;
        background: #fff;
        border: 1px solid #ebe7f3;
        border-radius: 7px;
        text-decoration: none;
      }
      .steplink:hover, .steplink:focus { border-color: #8f7bf2; background: #faf9ff; }
      .steplink .idx { min-width: 19px; height: 19px; display: inline-flex; align-items: center; justify-content: center; border-radius: 5px; color: #fff; background: #8f7bf2; font-size: 10px; font-weight: 600; flex: 0 0 auto; }
      .steplink .stx { display: flex; flex: 1; min-width: 0; flex-direction: column; line-height: 1.35; }
      .steplink .stx b { color: #342d44; font-weight: 600; }
      .stepdetail { margin-top: 2px; color: #6c657c; }
      .steplin { margin-top: 2px; color: #8b829e; font-size: 11px; }
      .live-reasoning { opacity: .82; }
      .result-table-wrap { margin-top: 8px; overflow-x: auto; }
      .result-table { border-collapse: collapse; width: 100%; font-size: 12px; }
      .result-table th, .result-table td {
        border: 1px solid #dadce0;
        padding: 5px 6px;
        text-align: left;
        vertical-align: top;
      }
      .result-table th { background: #f1f3f4; font-weight: 500; }
      .bottom {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        box-sizing: border-box;
        padding: 8px 12px 10px;
        background: transparent;
        border-top: 1px solid #dadce0;
      }
      .composer { display: flex; gap: 8px; align-items: flex-end; }
      .composer textarea {
        min-height: 36px;
        max-height: 112px;
        flex: 1;
        resize: vertical;
        box-sizing: border-box;
        border: 1px solid #d9d4df;
        border-radius: 8px;
        padding: 8px 9px;
      }
      .composer button { flex: 0 0 auto; }
      #send { border: 0; width: 34px; min-width: 34px !important; max-width: 34px; height: 34px; border-radius: 50%; background: #5d33fb; color: #fff; padding: 0; cursor: pointer; font-size: 18px; line-height: 34px; }
      #send:disabled { opacity: .45; cursor: default; }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    </style>
  </head>
  <body>
    <div class="sidebar branding-below">
      <div class="topline">
        <button class="new-chat" id="newConversation" type="button">+ New chat</button>
        <span class="sync-meta"><span id="sheetCount">0 sheets</span><button class="sync-state" id="syncState" type="button" hidden></button></span>
      </div>
      <div class="context" id="context" aria-live="polite">Reading the current sheet…</div>
      <div id="thread" aria-live="polite">
        <div class="empty" id="empty">Ask a question about the current sheet.</div>
      </div>
    </div>

    <div class="sidebar bottom">
      <form class="composer" id="composer">
        <label class="sr-only" for="question">Ask about this spreadsheet</label>
        <textarea id="question" placeholder="Ask about this spreadsheet…" rows="1" disabled></textarea>
        <button class="blue" id="send" type="submit" aria-label="Send" disabled>↑</button>
      </form>
    </div>

    <script src="https://chat.prereasoner.com/lib/result-wire.js?v=1"></script>
    <script src="https://chat.prereasoner.com/lib/turn-renderer.js?v=1"></script>
    <script>
      var INITIAL_CONTEXT = <?!= initialContext ?>;
      var REASON_BASE = <?!= reasonBase ?>;
      (function () {
        var state = { conversationId: '', history: [], turns: [], context: null, busy: false, checking: false,
          restoring: true, stale: false, syncError: false, errorAction: '', lastTurn: null,
          lastQuestion: '', syncedFingerprint: '' };
        var contextEl = document.getElementById('context');
        var threadEl = document.getElementById('thread');
        var emptyEl = document.getElementById('empty');
        var questionEl = document.getElementById('question');
        var sendEl = document.getElementById('send');
        var sheetCountEl = document.getElementById('sheetCount');
        var syncStateEl = document.getElementById('syncState');
        var scrollEl = document.querySelector('.branding-below');

        function scrollConversation(force) {
          if (!scrollEl) return;
          var nearBottom = scrollEl.scrollHeight - scrollEl.scrollTop - scrollEl.clientHeight < 90;
          if (!force && !nearBottom) return;
          window.requestAnimationFrame(function () { scrollEl.scrollTop = scrollEl.scrollHeight; });
        }

        function renderSyncState(mode) {
          var modes = {
            current: ['✓', 'Synced', 'Source data and answer are in sync', true],
            checking: ['…', 'Checking', 'Checking data sync', true],
            stale: ['↻', 'Recalculate', 'Answer is stale. Recalculate', false],
            error: ['!', 'Retry sync', 'Data sync failed. Retry', false],
            'session-error': ['!', 'Retry save', 'Conversation state could not be updated. Retry', false]
          };
          if (!mode || !modes[mode]) { syncStateEl.hidden = true; return; }
          var item = modes[mode]; syncStateEl.hidden = false; syncStateEl.className = 'sync-state ' + mode;
          syncStateEl.innerHTML = '<span class="sync-glyph">' + item[0] + '</span><span>' + item[1] + '</span>';
          syncStateEl.title = item[2]; syncStateEl.setAttribute('aria-label', item[2]);
          syncStateEl.disabled = item[3];
        }

        function esc(value) {
          var node = document.createElement('div');
          node.textContent = value == null ? '' : String(value);
          return node.innerHTML;
        }

        function callServer(name, arg) {
          return new Promise(function (resolve, reject) {
            var runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
            if (arg === undefined) runner[name]();
            else runner[name](arg);
          });
        }

        function errorText(error) {
          var message = (error && (error.message || error.toString())) || 'The add-on could not read this spreadsheet.';
          if (/server error occurred while reading from storage|PERMISSION_DENIED/i.test(message)) {
            return 'Google could not run this sidebar in the current account session. If you are signed in to multiple Google accounts, open this sheet in a single-account window and authorize Prereasoner again.';
          }
          return message;
        }

        function renderContext(context, focus) {
          state.context = context;
          if (!context || context.error) {
            contextEl.hidden = false;
            contextEl.className = 'context status-error';
            contextEl.textContent = context && context.error
              ? context.error
              : 'Could not read this spreadsheet. Reload the sidebar after authorizing the add-on.';
            questionEl.disabled = true;
            sendEl.disabled = true;
            return;
          }
          var tabs = Number(context.tableCount || (context.tables && context.tables.length) || 1);
          contextEl.className = 'context'; contextEl.hidden = true;
          sheetCountEl.textContent = tabs + ' sheet' + (tabs === 1 ? '' : 's');
          updateComposerAvailability();
          if (focus !== false && !state.restoring) questionEl.focus();
        }

        function updateComposerAvailability() {
          var disabled = state.busy || state.restoring || state.checking || !state.context || !!state.context.error;
          questionEl.disabled = disabled;
          sendEl.disabled = disabled;
        }

        function addUserTurn(text) {
          var empty = threadEl.querySelector('.empty'); if (empty) empty.remove();
          var turn = document.createElement('div');
          turn.className = 'turn';
          turn.innerHTML = '<div class="question">' + esc(text) + '</div>';
          threadEl.appendChild(turn);
          scrollConversation(true);
          return turn;
        }

        function addPending(turn) {
          var answer = document.createElement('div');
          answer.className = 'answer pending';
          answer.innerHTML = '<div class="pending-status">Reading your sheet…</div>';
          turn.appendChild(answer);
          scrollConversation(true);
          return answer;
        }

        function startPendingProgress(answer) {
          var messages = [
            'Planning the analysis…',
            'Calculating and verifying…',
            'Still working — complex questions can take about a minute.'
          ];
          var index = 0;
          var timer = window.setInterval(function () {
            if (!answer.isConnected || !answer.classList.contains('pending')) {
              window.clearInterval(timer);
              return;
            }
            if (answer.dataset.live !== '1') {
              var status = answer.querySelector('.pending-status');
              if (status) status.textContent = messages[Math.min(index, messages.length - 1)];
            }
            index += 1;
          }, 8000);
          return function () { window.clearInterval(timer); };
        }

        var liveSessionPromise = null;

        function ensureLiveSession() {
          if (!liveSessionPromise) {
            liveSessionPromise = callServer('getPrereasonerLiveSession').then(function (session) {
              if (!session || !session.token || !session.uid || !session.databaseUrl) throw new Error('Live updates unavailable');
              return session;
            }).catch(function (error) {
              liveSessionPromise = null;
              throw error;
            });
          }
          return liveSessionPromise;
        }

        function liveTurnId() {
          if (window.crypto && window.crypto.getRandomValues) {
            var bytes = new Uint8Array(16);
            window.crypto.getRandomValues(bytes);
            return Array.prototype.map.call(bytes, function (value) {
              return value.toString(16).padStart(2, '0');
            }).join('');
          }
          return String(Date.now()) + '-' + Math.random().toString(36).slice(2);
        }

        function orderedValues(value) {
          if (Array.isArray(value)) return value.filter(function (item) { return item != null; });
          if (!value || typeof value !== 'object') return [];
          return Object.keys(value).sort(function (a, b) {
            var an = /^\d+$/.test(a) ? Number(a) : NaN;
            var bn = /^\d+$/.test(b) ? Number(b) : NaN;
            return isNaN(an) || isNaN(bn) ? a.localeCompare(b) : an - bn;
          }).map(function (key) { return value[key]; }).filter(function (item) { return item != null; });
        }

        async function liveJson(session, path, shallow) {
          var url = String(session.databaseUrl).replace(/\/$/, '') + '/' + path + '.json?auth=' +
            encodeURIComponent(session.token) + (shallow ? '&shallow=true' : '');
          var response = await fetch(url, {cache: 'no-store'});
          if (!response.ok) throw new Error('Live trace unavailable');
          var value = await response.json();
          return window.RESULT_WIRE ? window.RESULT_WIRE.decode(value) : value;
        }

        function liveStatus(value) {
          var statuses = {
            running: 'Understanding your question…', resolving: 'Connecting the relevant data…',
            planning: 'Planning the analysis…', done: 'Finalizing the answer…'
          };
          return statuses[String(value || '').toLowerCase()] || 'Working through the data…';
        }

        function liveStepLabel(view, index) {
          var labels = {join: 'Combined', world_join: 'Reference lookup', world_filter: 'Filtered',
            filter: 'Filtered', time_filter: 'Date filter', having: 'Filtered', group_agg: 'Total',
            yoy: 'Year-over-year', running: 'Running total', divide: 'Ratio', share: 'Share',
            topn: 'Top results', sort: 'Sorted', cross: 'Candidate pairs', anti_join: 'Not yet matched',
            select: 'Result'};
          var operation = String((view && view.op) || '');
          return labels[operation] || String((view && (view.logical_name || view.label)) || ('Step ' + (index + 1))).replace(/_/g, ' ');
        }

        function liveStepDetail(operation) {
          var details = {join: 'Connected related rows across sheets.', world_join: 'Connected workbook values to reference data.',
            world_filter: 'Applied the requested reference-data condition.', filter: 'Kept the rows that match the question.',
            time_filter: 'Kept the rows in the requested period.', having: 'Kept the matching groups.',
            group_agg: 'Grouped the matching rows and calculated the measure.', topn: 'Kept the highest-ranked results.',
            sort: 'Ordered the result.', cross: 'Built the candidate combinations.', anti_join: 'Removed combinations already present in the data.',
            divide: 'Divided the requested measures.', share: 'Calculated each value as a share of the total.'};
          return details[operation] || 'Calculated an intermediate result.';
        }

        function liveReasoning(jobs) {
          var steps = [], analysis = null;
          Object.keys(jobs).forEach(function (jobId) {
            var job = jobs[jobId];
            if (job.analysis) analysis = job.analysis;
            var views = orderedValues(job.views);
            views.forEach(function (view, index) {
              if (!view || typeof view !== 'object') return;
              var rawSection = String(view.section || '');
              steps.push({
                label: liveStepLabel(view, index), kind: String(view.op || 'step'),
                detail: liveStepDetail(String(view.op || '')),
                inputs: Array.isArray(view.inputs) ? view.inputs.map(String) : [],
                sectionId: rawSection ? jobId + ':' + rawSection : '',
                sectionLabel: String(view.section_label || rawSection || ''),
                sectionQuestion: String(view.section_question || ''),
                sectionInputs: (Array.isArray(view.section_inputs) ? view.section_inputs : []).map(function (input) {
                  return jobId + ':' + String(input);
                }),
                isOutput: !!view.is_output || index === views.length - 1
              });
            });
          });
          return {steps: steps, analysis: analysis};
        }

        function startLiveTurn(session, turnId, turn, pendingAnswer) {
          var stopped = false, timer = null, jobs = {};
          var base = 'runs/' + encodeURIComponent(session.uid) + '/';

          async function refreshJob(jobId) {
            if (!jobs[jobId]) jobs[jobId] = {views: {}, analysis: null};
            var job = jobs[jobId];
            var changed = false;
            var values = await Promise.all([
              liveJson(session, base + encodeURIComponent(jobId) + '/status', false),
              job.analysis ? Promise.resolve(job.analysis) : liveJson(session, base + encodeURIComponent(jobId) + '/analysis', false),
              liveJson(session, base + encodeURIComponent(jobId) + '/views', true)
            ]);
            if (values[0]) {
              var status = pendingAnswer.querySelector('.pending-status');
              if (status) status.textContent = liveStatus(values[0]);
            }
            if (!job.analysis && values[1]) { job.analysis = values[1]; changed = true; }
            var keys = values[2] && typeof values[2] === 'object' ? Object.keys(values[2]) : [];
            var fresh = keys.filter(function (key) { return !Object.prototype.hasOwnProperty.call(job.views, key); });
            if (fresh.length) {
              var loaded = await Promise.all(fresh.map(function (key) {
                return liveJson(session, base + encodeURIComponent(jobId) + '/views/' + encodeURIComponent(key), false);
              }));
              fresh.forEach(function (key, index) { if (loaded[index]) job.views[key] = loaded[index]; });
              changed = true;
            }
            return changed;
          }

          function showLiveReasoning() {
            var data = liveReasoning(jobs);
            if (!data.steps.length) return;
            var previous = turn.querySelector('.live-reasoning');
            var open = !!(previous && previous.open);
            if (previous) previous.remove();
            var details = renderReasoning(turn, data.steps, data.analysis, 'live-reasoning');
            if (details) details.open = open;
            scrollConversation(false);
          }

          async function poll() {
            if (stopped) return;
            try {
              var root = await liveJson(session, base + encodeURIComponent(turnId), false);
              if (root && typeof root === 'object') {
                pendingAnswer.dataset.live = '1';
                var status = pendingAnswer.querySelector('.pending-status');
                if (status) status.textContent = liveStatus(root.status);
                if (typeof root.reply === 'string' && root.reply.trim()) {
                  var reply = pendingAnswer.querySelector('.streamed-reply');
                  if (!reply) {
                    reply = document.createElement('div'); reply.className = 'streamed-reply'; pendingAnswer.appendChild(reply);
                  }
                  renderAnswer(reply, root.reply);
                  pendingAnswer.classList.add('has-reply');
                  scrollConversation(false);
                }
                if (root.conversation_id) state.conversationId = String(root.conversation_id);
                var calls = orderedValues(root.calls).filter(function (call) { return call && call.jobId; });
                var changed = false;
                var updates = await Promise.all(calls.map(function (call) {
                  return refreshJob(String(call.jobId)).catch(function () { return false; });
                }));
                updates.forEach(function (value) { changed = changed || value; });
                if (changed) showLiveReasoning();
              }
            } catch (_) {
              // The authoritative Apps Script request remains active; staged progress is the fallback.
            }
            if (!stopped) timer = window.setTimeout(poll, 1200);
          }

          poll();
          return function () { stopped = true; if (timer) window.clearTimeout(timer); };
        }

        function renderer() { return window.PrereasonerTurnRenderer || null; }

        function renderAnswer(answer, text) {
          var shared = renderer();
          if (shared) answer.innerHTML = shared.renderMarkdown(text || 'No answer was returned.');
          else answer.textContent = text || 'No answer was returned.';
        }

        function analysisName(analysis) {
          var shared = renderer();
          var name = shared ? shared.analysisName(analysis) : '';
          return name || 'this answer';
        }

        function fullAnalysisUrl() {
          return state.conversationId ? REASON_BASE + encodeURIComponent(state.conversationId) : '';
        }

        function renderReasoning(turn, reasoning, analysis, extraClass) {
          if (!reasoning || !reasoning.length) return;
          var shared = renderer();
          if (!shared) return;
          var details = document.createElement('details');
          details.className = 'reasoning' + (extraClass ? ' ' + extraClass : '');
          var url = fullAnalysisUrl();
          var title = 'Reasoning steps for ' + analysisName(analysis);
          var tree = shared.renderReasoningTree(reasoning, {
            renderStep: function (step, index) {
              var label = esc(step.label || ('Step ' + (index + 1)));
              var content = '<span class="idx">' + (index + 1) + '</span><span class="stx"><b>' + label + '</b>' +
                (step.detail ? '<span class="stepdetail">' + esc(step.detail) + '</span>' : '') +
                (step.inputs && step.inputs.length ? '<span class="steplin">From ' + esc(step.inputs.join(', ').replace(/_/g, ' ')) + '</span>' : '') + '</span>';
              return url
                ? '<a class="steplink" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer" title="Open this reasoning in Prereasoner">' + content + '</a>'
                : '<div class="steplink">' + content + '</div>';
            }
          });
          details.innerHTML = '<summary><span class="reasoning-title">' + esc(title) + '</span></summary>' +
            '<div class="reasoning-body">' +
            (url ? '<a class="analysis-open" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">Open full analysis ↗</a>' : '') +
            tree + '</div>';
          turn.appendChild(details);
          return details;
        }

        function renderResult(turn, result) {
          if (!result || !Array.isArray(result.rows) || !result.rows.length) return;
          var headers = Array.isArray(result.headers) ? result.headers : (Array.isArray(result.columns) ? result.columns : []);
          if (result.rows.length === 1 && headers.length === 1) return;
          var wrap = document.createElement('div');
          wrap.className = 'result-table-wrap';
          var html = '<table class="result-table"><thead><tr>' + headers.map(function (h) {
            return '<th>' + esc(h) + '</th>';
          }).join('') + '</tr></thead><tbody>';
          html += result.rows.map(function (row) {
            return '<tr>' + row.map(function (cell) { return '<td>' + esc(cell) + '</td>'; }).join('') + '</tr>';
          }).join('') + '</tbody></table>';
          wrap.innerHTML = html;
          turn.appendChild(wrap);
        }

        function completedTurnData(question, response) {
          return {
            question: String(question || ''),
            reply: String(response.reply || 'No answer was returned.'),
            reasoning: Array.isArray(response.reasoning || response.steps) ? (response.reasoning || response.steps) : [],
            analysis: response.analysis && typeof response.analysis === 'object' ? response.analysis : null,
            result: response.result || null,
            resultTrusted: response.resultTrusted === true
          };
        }

        function renderCompletedTurn(data) {
          var turn = addUserTurn(data.question);
          var answer = document.createElement('div');
          answer.className = 'answer';
          renderAnswer(answer, data.reply);
          turn.appendChild(answer);
          renderReasoning(turn, data.reasoning, data.analysis);
          if (data.resultTrusted) renderResult(turn, data.result);
          return turn;
        }

        function sidebarSnapshot() {
          return {
            client: 'google-sheets-addon',
            version: 1,
            history: state.history.slice(-24),
            turns: state.turns.slice(-24),
            syncedFingerprint: state.syncedFingerprint
          };
        }

        function persistCurrentState() {
          if (!state.conversationId) return Promise.resolve();
          return callServer('savePrereasonerSheetConversation', {
            conversationId: state.conversationId,
            state: sidebarSnapshot()
          });
        }

        function finishTurn(turn, response, replacing, baseHistory) {
          if (replacing) while (turn.children.length > 1) turn.removeChild(turn.lastChild);
          var pending = turn.querySelector('.pending');
          if (pending) pending.remove();
          var liveReasoning = turn.querySelector('.live-reasoning');
          if (liveReasoning) liveReasoning.remove();
          var answer = document.createElement('div');
          answer.className = 'answer';
          renderAnswer(answer, response.reply);
          turn.appendChild(answer);
          renderReasoning(turn, response.reasoning || response.steps, response.analysis);
          if (response.resultTrusted === true) renderResult(turn, response.result);
          var turnData = completedTurnData(turn.querySelector('.question').textContent, response);
          if (replacing && state.turns.length) state.turns[state.turns.length - 1] = turnData;
          else state.turns.push(turnData);
          if (state.turns.length > 24) state.turns = state.turns.slice(-24);
          if (replacing) state.history = (baseHistory || []).slice();
          state.history.push({ role: 'user', content: turn.querySelector('.question').textContent });
          state.history.push({ role: 'assistant', content: response.reply || '' });
          if (state.history.length > 24) state.history = state.history.slice(-24);
          state.lastTurn = turn;
          state.lastQuestion = turn.querySelector('.question').textContent;
          if (response.context) renderContext(response.context, false);
          state.syncedFingerprint = response.context && response.context.fingerprint || state.syncedFingerprint;
          state.stale = false; state.syncError = false; state.errorAction = ''; turn.classList.remove('recalculating'); renderSyncState('current');
          scrollConversation(true);
        }

        function setBusy(busy) {
          state.busy = busy;
          updateComposerAvailability();
          sendEl.textContent = busy ? '…' : '↑';
        }

        function markSessionSaveError() {
          state.syncError = true;
          state.errorAction = 'save';
          renderSyncState('session-error');
        }

        async function submit() {
          if (state.busy || state.checking || !state.context) return;
          var text = questionEl.value.trim();
          if (!text) return;
          questionEl.value = '';
          var turn = addUserTurn(text);
          var pendingAnswer = addPending(turn);
          var stopProgress = startPendingProgress(pendingAnswer);
          var stopLive = function () {};
          var turnId = liveTurnId();
          setBusy(true);
          renderSyncState('checking');
          try {
            if (state.conversationId) {
              var latest = await callServer('getSheetContext');
              renderContext(latest, false);
              if (state.syncedFingerprint && latest.fingerprint !== state.syncedFingerprint) {
                var source = await callServer('syncPrereasonerConversation', {conversationId: state.conversationId});
                if (source.context) renderContext(source.context, false);
              }
            }
            try {
              var liveSession = await ensureLiveSession();
              stopLive = startLiveTurn(liveSession, turnId, turn, pendingAnswer);
            } catch (_) {}
            var response = await callServer('askPrereasoner', {
              question: text,
              conversationId: state.conversationId,
              history: state.history,
              turnId: turnId
            });
            state.conversationId = response.conversationId || state.conversationId;
            finishTurn(turn, response);
            try {
              await persistCurrentState();
            } catch (_) {
              markSessionSaveError();
            }
          } catch (error) {
            var pending = turn.querySelector('.pending');
            if (pending) {
              pending.className = 'answer error';
              pending.setAttribute('role', 'alert');
              pending.textContent = errorText(error);
            }
            questionEl.value = text;
            questionEl.scrollTop = 0;
            renderSyncState(state.stale ? 'stale' : (state.conversationId ? 'current' : null));
          } finally {
            stopLive();
            stopProgress();
            setBusy(false);
            questionEl.focus();
            if (questionEl.value) questionEl.scrollTop = 0;
          }
        }

        async function checkSync() {
          if (!state.conversationId || state.busy || state.restoring || state.checking ||
              (state.syncError && state.errorAction === 'save') || document.hidden) return;
          if (state.stale) { renderSyncState('stale'); return; }
          state.checking = true; renderSyncState('checking'); updateComposerAvailability();
          try {
            var context = await callServer('getSheetContext');
            renderContext(context, false);
            if (state.syncedFingerprint && context.fingerprint !== state.syncedFingerprint) {
              var result = await callServer('syncPrereasonerConversation', {conversationId: state.conversationId});
              if (result.context) renderContext(result.context, false);
              state.stale = true;
            }
            state.syncError = false; state.errorAction = '';
            renderSyncState(state.stale ? 'stale' : 'current');
          } catch (_) {
            state.syncError = true; state.errorAction = 'sync'; renderSyncState('error');
          } finally { state.checking = false; updateComposerAvailability(); }
        }

        async function recalculateCurrent() {
          if (state.busy || state.checking || !state.stale || !state.lastTurn || !state.lastQuestion) return;
          var turn = state.lastTurn, baseHistory = state.history.slice(0, -2);
          var progress = addPending(turn), stopProgress = startPendingProgress(progress), stopLive = function () {};
          var turnId = liveTurnId();
          turn.classList.add('recalculating'); setBusy(true); renderSyncState('checking');
          try {
            try {
              var liveSession = await ensureLiveSession();
              stopLive = startLiveTurn(liveSession, turnId, turn, progress);
            } catch (_) {}
            var response = await callServer('askPrereasoner', {
              question: state.lastQuestion, conversationId: state.conversationId, history: baseHistory, turnId: turnId
            });
            state.conversationId = response.conversationId || state.conversationId;
            finishTurn(turn, response, true, baseHistory);
            try {
              await persistCurrentState();
            } catch (_) {
              markSessionSaveError();
            }
          } catch (_) {
            var pending = turn.querySelector('.pending'); if (pending) pending.remove();
            turn.classList.remove('recalculating'); state.syncError = true; state.errorAction = 'recalc'; renderSyncState('error');
          } finally { stopLive(); stopProgress(); setBusy(false); questionEl.focus(); }
        }

        syncStateEl.addEventListener('click', async function () {
          if (state.syncError && state.errorAction === 'clear') {
            renderSyncState('checking');
            try {
              await callServer('clearPrereasonerSheetConversation');
              state.syncError = false; state.errorAction = ''; renderSyncState(null);
            } catch (_) { renderSyncState('session-error'); }
            return;
          }
          if (state.syncError && state.errorAction === 'save') {
            renderSyncState('checking');
            try {
              await persistCurrentState();
              state.syncError = false; state.errorAction = '';
              renderSyncState(state.stale ? 'stale' : 'current');
            } catch (_) { markSessionSaveError(); }
            return;
          }
          if (state.syncError && state.errorAction === 'recalc') recalculateCurrent();
          else if (state.syncError) checkSync(); else if (state.stale) recalculateCurrent();
        });

        document.getElementById('composer').addEventListener('submit', function (event) {
          event.preventDefault();
          submit();
        });
        questionEl.addEventListener('keydown', function (event) {
          if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            submit();
          }
        });
        document.getElementById('newConversation').addEventListener('click', async function () {
          if (state.busy || state.restoring) return;
          state.conversationId = '';
          state.history = [];
          state.turns = [];
          state.stale = false; state.syncError = false; state.errorAction = ''; state.lastTurn = null; state.lastQuestion = ''; state.syncedFingerprint = '';
          threadEl.innerHTML = '';
          var fresh = document.createElement('div');
          fresh.className = 'empty';
          fresh.textContent = 'Starting a new chat…';
          threadEl.appendChild(fresh);
          questionEl.value = '';
          questionEl.scrollTop = 0;
          renderSyncState(null);
          state.restoring = true;
          updateComposerAvailability();
          try {
            await callServer('clearPrereasonerSheetConversation');
            fresh.textContent = 'Ask a question about the current sheet.';
          } catch (_) {
            fresh.textContent = 'Ask a question about the current sheet.';
            state.syncError = true; state.errorAction = 'clear'; renderSyncState('session-error');
          } finally {
            state.restoring = false;
            updateComposerAvailability();
            questionEl.focus();
          }
        });

        function restoreConversation(payload) {
          payload = payload || {};
          if (payload.context) renderContext(payload.context, false);
          state.restoring = false;
          state.conversationId = String(payload.conversationId || '');
          state.stale = !!payload.stale;
          state.syncedFingerprint = '';
          state.history = [];
          state.turns = [];
          state.lastTurn = null;
          state.lastQuestion = '';
          threadEl.innerHTML = '';
          var saved = payload.state;
          if (state.conversationId && saved && saved.client === 'google-sheets-addon' &&
              Number(saved.version) === 1 && Array.isArray(saved.turns) && saved.turns.length) {
            state.history = Array.isArray(saved.history) ? saved.history.slice(-24) : [];
            state.turns = saved.turns.slice(-24).map(function (item) {
              return completedTurnData(item && item.question, item || {});
            });
            state.syncedFingerprint = String(saved.syncedFingerprint || '');
            if (!state.syncedFingerprint && !state.stale && state.context) {
              state.syncedFingerprint = String(state.context.fingerprint || '');
            }
            if (state.syncedFingerprint && state.context &&
                state.syncedFingerprint !== String(state.context.fingerprint || '')) state.stale = true;
            state.turns.forEach(function (item) { state.lastTurn = renderCompletedTurn(item); });
            state.lastQuestion = state.turns[state.turns.length - 1].question;
            renderSyncState(state.stale ? 'stale' : 'current');
            scrollConversation(true);
          } else if (state.conversationId) {
            var note = document.createElement('div');
            note.className = 'restore-note';
            var title = document.createElement('strong');
            title.textContent = 'Previous conversation reconnected';
            note.appendChild(title);
            note.appendChild(document.createTextNode(payload.legacyQuestion
              ? 'It started with “' + payload.legacyQuestion + '”. Earlier sidebar messages predate automatic restoration.'
              : 'Earlier sidebar messages predate automatic restoration.'));
            threadEl.appendChild(note);
            renderSyncState(null);
          } else {
            var empty = document.createElement('div');
            empty.className = 'empty';
            empty.textContent = 'Ask a question about the current sheet.';
            threadEl.appendChild(empty);
            renderSyncState(null);
          }
          updateComposerAvailability();
          questionEl.focus();
        }

        var contextRequest = INITIAL_CONTEXT && typeof INITIAL_CONTEXT === 'object'
          ? Promise.resolve(INITIAL_CONTEXT)
          : callServer('getSheetContext');
        if (emptyEl) emptyEl.textContent = 'Restoring this sheet’s conversation…';
        contextRequest.then(function (context) {
          renderContext(context, false);
          return callServer('restorePrereasonerSheetConversation');
        }).then(restoreConversation).catch(function (error) {
          state.restoring = false;
          renderContext(state.context || { error: 'Could not read this spreadsheet: ' + errorText(error) }, false);
          threadEl.innerHTML = '';
          var empty = document.createElement('div');
          empty.className = 'empty status-error';
          empty.textContent = 'Could not restore this sheet’s conversation. You can start a new chat.';
          threadEl.appendChild(empty);
          updateComposerAvailability();
        });
        window.setInterval(checkSync, 15000);
      }());
    </script>
  </body>
</html>
