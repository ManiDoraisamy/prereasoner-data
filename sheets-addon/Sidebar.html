<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; }
      iframe { display: block; width: 100%; height: 100%; border: 0; }
    </style>
  </head>
  <body>
    <!-- The sidebar IS the Prereasoner web workbook (https://chat.prereasoner.com/embed/sheets): the same
         page, live reasoning and conversation history as the web app. This host renders nothing; it
         only answers the workbook's requests for this spreadsheet's context (Code.js). -->
    <iframe id="prereasoner" title="Prereasoner" src="<?= embedUrl ?>" allow="clipboard-write"></iframe>
    <script>
      (function () {
        var ORIGIN = 'https://chat.prereasoner.com';
        var SERVER = {context: 'getHostContext', grids: 'getWorkbookGrids'};
        var frame = document.getElementById('prereasoner');

        function reply(id, type, payload) {
          frame.contentWindow.postMessage({prereasoner: 1, id: id, type: type, payload: payload}, ORIGIN);
        }

        function explain(error) {
          var message = String((error && error.message) || error || 'The spreadsheet could not be read.');
          if (/PERMISSION_DENIED/i.test(message)) {
            return 'Google blocked access to this sheet. Reopen the add-on in the account that owns ' +
              'the sheet, then authorize it.';
          }
          return message;
        }

        window.addEventListener('message', function (event) {
          if (event.origin !== ORIGIN || event.source !== frame.contentWindow) return;
          var message = event.data || {};
          var name = message.prereasoner && SERVER[message.type];
          if (!name) return;
          google.script.run
            .withSuccessHandler(function (payload) { reply(message.id, message.type, payload); })
            .withFailureHandler(function (error) { reply(message.id, 'error', {message: explain(error)}); })
            [name]();
        });
      })();
    </script>
  </body>
</html>
