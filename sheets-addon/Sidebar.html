<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link rel="stylesheet" href="https://ssl.gstatic.com/docs/script/css/add-ons1.css">
    <style>
      html, body { height: 100%; }
      body { margin: 0; color: #202124; font: 13px Arial, sans-serif; }
      .branding-below {
        bottom: 54px;
        top: 0;
        overflow-y: auto;
        padding: 0 16px 16px;
        box-sizing: border-box;
      }
      .topline {
        min-height: 52px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid #dadce0;
      }
      .new-chat {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 30px;
        box-sizing: border-box;
        border: 1px solid #dadce0;
        border-radius: 7px;
        background: #fff;
        color: #3c3154;
        padding: 0 9px;
        font: 400 12px/14px Arial, sans-serif;
        line-height: 14px;
        cursor: pointer;
      }
      .new-chat:hover { background: #f7f5fb; border-color: #c8bfd8; }
      .sync-meta { display: inline-flex; align-items: center; gap: 7px; color: #5f6368; font-size: 12px; white-space: nowrap; }
      .sync-state { border: 0; width: 24px; height: 24px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; cursor: pointer; }
      .sync-state[hidden] { display: none; }
      .sync-state.current { color: #137a43; background: #e3f4e9; cursor: default; }
      .sync-state.checking { color: #9a5c00; background: #fff0d1; cursor: default; letter-spacing: 1px; }
      .sync-state.stale, .sync-state.error, .sync-state.session-error { color: #b3261e; background: #fce8e6; }
      .context {
        padding: 11px 0 13px;
        color: #5f6368;
        border-bottom: 1px solid #f1f3f4;
      }
      .context[hidden] { display: none; }
      .context strong { color: #202124; font-weight: 500; }
      .status-error { color: #b31412; }
      .empty {
        padding: 26px 0;
        color: #5f6368;
        line-height: 1.5;
      }
      .restore-note {
        margin: 16px 0;
        padding: 11px;
        color: #5f6368;
        background: #f8f9fa;
        border: 1px solid #dadce0;
        border-radius: 8px;
        line-height: 1.45;
      }
      .restore-note strong { display: block; margin-bottom: 4px; color: #202124; font-weight: 500; }
      .turn { margin: 14px 0 18px; }
      .question {
        display: inline-block;
        max-width: 94%;
        margin-left: 6%;
        padding: 9px 11px;
        color: #4f2fd0;
        background: #f0ecfc;
        border-radius: 8px;
        line-height: 1.4;
        box-sizing: border-box;
      }
      .answer {
        margin-top: 8px;
        padding: 11px;
        background: #f8f9fa;
        border: 1px solid #dadce0;
        border-radius: 8px;
        line-height: 1.45;
        white-space: pre-wrap;
      }
      .answer.pending { color: #5f6368; }
      .answer.error { color: #8d1b15; background: #fce8e6; border-color: #f2b8b5; }
      .turn.recalculating { opacity: .65; }
      details.reasoning {
        margin-top: 8px;
        border: 1px solid #dadce0;
        border-radius: 6px;
        overflow: hidden;
      }
      details.reasoning summary {
        padding: 8px 10px;
        color: #5f6368;
        cursor: pointer;
        list-style-position: inside;
      }
      .reasoning-body { padding: 0 10px 10px; color: #5f6368; }
      .operation { padding: 7px 0; border-top: 1px solid #f1f3f4; }
      .operation:first-child { border-top: 0; }
      .operation-label { color: #202124; font-weight: 500; }
      .operation-detail { margin-top: 3px; line-height: 1.4; }
      .result-table-wrap { margin-top: 8px; overflow-x: auto; }
      .result-table { border-collapse: collapse; width: 100%; font-size: 12px; }
      .result-table th, .result-table td {
        border: 1px solid #dadce0;
        padding: 5px 6px;
        text-align: left;
        vertical-align: top;
      }
      .result-table th { background: #f1f3f4; font-weight: 500; }
      .bottom {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        box-sizing: border-box;
        padding: 8px 12px 10px;
        background: transparent;
        border-top: 1px solid #dadce0;
      }
      .composer { display: flex; gap: 8px; align-items: flex-end; }
      .composer textarea {
        min-height: 36px;
        max-height: 112px;
        flex: 1;
        resize: vertical;
        box-sizing: border-box;
        border: 1px solid #d9d4df;
        border-radius: 8px;
        padding: 8px 9px;
      }
      .composer button { flex: 0 0 auto; }
      #send { border: 0; width: 34px; min-width: 34px !important; max-width: 34px; height: 34px; border-radius: 50%; background: #5d33fb; color: #fff; padding: 0; cursor: pointer; font-size: 18px; line-height: 34px; }
      #send:disabled { opacity: .45; cursor: default; }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    </style>
  </head>
  <body>
    <div class="sidebar branding-below">
      <div class="topline">
        <button class="new-chat" id="newConversation" type="button">+ New chat</button>
        <span class="sync-meta"><span id="sheetCount">0 sheets</span><button class="sync-state" id="syncState" type="button" hidden></button></span>
      </div>
      <div class="context" id="context" aria-live="polite">Reading the current sheet…</div>
      <div id="thread" aria-live="polite">
        <div class="empty" id="empty">Ask a question about the current sheet.</div>
      </div>
    </div>

    <div class="sidebar bottom">
      <form class="composer" id="composer">
        <label class="sr-only" for="question">Ask about this spreadsheet</label>
        <textarea id="question" placeholder="Ask about this spreadsheet…" rows="1" disabled></textarea>
        <button class="blue" id="send" type="submit" aria-label="Send" disabled>↑</button>
      </form>
    </div>

    <script>
      var INITIAL_CONTEXT = <?!= initialContext ?>;
      (function () {
        var state = { conversationId: '', history: [], turns: [], context: null, busy: false, checking: false,
          restoring: true, stale: false, syncError: false, errorAction: '', lastTurn: null,
          lastQuestion: '', syncedFingerprint: '' };
        var contextEl = document.getElementById('context');
        var threadEl = document.getElementById('thread');
        var emptyEl = document.getElementById('empty');
        var questionEl = document.getElementById('question');
        var sendEl = document.getElementById('send');
        var sheetCountEl = document.getElementById('sheetCount');
        var syncStateEl = document.getElementById('syncState');

        function renderSyncState(mode) {
          var modes = {
            current: ['✓', 'Source data and answer are in sync', true],
            checking: ['…', 'Checking data sync', true],
            stale: ['↻', 'Answer is stale. Recalculate', false],
            error: ['!', 'Data sync failed. Retry', false],
            'session-error': ['!', 'Conversation state could not be updated. Retry', false]
          };
          if (!mode || !modes[mode]) { syncStateEl.hidden = true; return; }
          var item = modes[mode]; syncStateEl.hidden = false; syncStateEl.className = 'sync-state ' + mode;
          syncStateEl.textContent = item[0]; syncStateEl.title = item[1]; syncStateEl.setAttribute('aria-label', item[1]);
          syncStateEl.disabled = item[2];
        }

        function esc(value) {
          var node = document.createElement('div');
          node.textContent = value == null ? '' : String(value);
          return node.innerHTML;
        }

        function callServer(name, arg) {
          return new Promise(function (resolve, reject) {
            var runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
            if (arg === undefined) runner[name]();
            else runner[name](arg);
          });
        }

        function errorText(error) {
          var message = (error && (error.message || error.toString())) || 'The add-on could not read this spreadsheet.';
          if (/server error occurred while reading from storage|PERMISSION_DENIED/i.test(message)) {
            return 'Google could not run this sidebar in the current account session. If you are signed in to multiple Google accounts, open this sheet in a single-account window and authorize Prereasoner again.';
          }
          return message;
        }

        function renderContext(context, focus) {
          state.context = context;
          if (!context || context.error) {
            contextEl.hidden = false;
            contextEl.className = 'context status-error';
            contextEl.textContent = context && context.error
              ? context.error
              : 'Could not read this spreadsheet. Reload the sidebar after authorizing the add-on.';
            questionEl.disabled = true;
            sendEl.disabled = true;
            return;
          }
          var tabs = Number(context.tableCount || (context.tables && context.tables.length) || 1);
          contextEl.className = 'context'; contextEl.hidden = true;
          sheetCountEl.textContent = tabs + ' sheet' + (tabs === 1 ? '' : 's');
          updateComposerAvailability();
          if (focus !== false && !state.restoring) questionEl.focus();
        }

        function updateComposerAvailability() {
          var disabled = state.busy || state.restoring || !state.context || !!state.context.error;
          questionEl.disabled = disabled;
          sendEl.disabled = disabled;
        }

        function addUserTurn(text) {
          var empty = threadEl.querySelector('.empty'); if (empty) empty.remove();
          var turn = document.createElement('div');
          turn.className = 'turn';
          turn.innerHTML = '<div class="question">' + esc(text) + '</div>';
          threadEl.appendChild(turn);
          return turn;
        }

        function addPending(turn) {
          var answer = document.createElement('div');
          answer.className = 'answer pending';
          answer.textContent = 'Reading your sheet…';
          turn.appendChild(answer);
          return answer;
        }

        function startPendingProgress(answer) {
          var messages = [
            'Planning the analysis…',
            'Calculating and verifying…',
            'Still working — complex questions can take about a minute.'
          ];
          var index = 0;
          var timer = window.setInterval(function () {
            if (!answer.isConnected || !answer.classList.contains('pending')) {
              window.clearInterval(timer);
              return;
            }
            answer.textContent = messages[Math.min(index, messages.length - 1)];
            index += 1;
          }, 8000);
          return function () { window.clearInterval(timer); };
        }

        function renderReasoning(turn, reasoning) {
          if (!reasoning || !reasoning.length) return;
          var details = document.createElement('details');
          details.className = 'reasoning';
          details.innerHTML = '<summary>Reasoning steps</summary>' +
            '<div class="reasoning-body">' + reasoning.map(function (step) {
              return '<div class="operation"><div class="operation-label">' + esc(step.label || 'Step') + '</div>' +
                (step.detail ? '<div class="operation-detail">' + esc(step.detail) + '</div>' : '') + '</div>';
            }).join('') + '</div>';
          turn.appendChild(details);
        }

        function renderResult(turn, result) {
          if (!result || !Array.isArray(result.rows) || !result.rows.length) return;
          var headers = Array.isArray(result.headers) ? result.headers : (Array.isArray(result.columns) ? result.columns : []);
          if (result.rows.length === 1 && headers.length === 1) return;
          var wrap = document.createElement('div');
          wrap.className = 'result-table-wrap';
          var html = '<table class="result-table"><thead><tr>' + headers.map(function (h) {
            return '<th>' + esc(h) + '</th>';
          }).join('') + '</tr></thead><tbody>';
          html += result.rows.map(function (row) {
            return '<tr>' + row.map(function (cell) { return '<td>' + esc(cell) + '</td>'; }).join('') + '</tr>';
          }).join('') + '</tbody></table>';
          wrap.innerHTML = html;
          turn.appendChild(wrap);
        }

        function completedTurnData(question, response) {
          return {
            question: String(question || ''),
            reply: String(response.reply || 'No answer was returned.'),
            reasoning: Array.isArray(response.reasoning || response.steps) ? (response.reasoning || response.steps) : [],
            result: response.result || null
          };
        }

        function renderCompletedTurn(data) {
          var turn = addUserTurn(data.question);
          var answer = document.createElement('div');
          answer.className = 'answer';
          answer.textContent = data.reply || 'No answer was returned.';
          turn.appendChild(answer);
          renderReasoning(turn, data.reasoning);
          renderResult(turn, data.result);
          return turn;
        }

        function sidebarSnapshot() {
          return {
            client: 'google-sheets-addon',
            version: 1,
            history: state.history.slice(-24),
            turns: state.turns.slice(-24)
          };
        }

        function persistCurrentState() {
          if (!state.conversationId) return Promise.resolve();
          return callServer('savePrereasonerSheetConversation', {
            conversationId: state.conversationId,
            state: sidebarSnapshot()
          });
        }

        function finishTurn(turn, response, replacing, baseHistory) {
          if (replacing) while (turn.children.length > 1) turn.removeChild(turn.lastChild);
          var pending = turn.querySelector('.pending');
          if (pending) pending.remove();
          var answer = document.createElement('div');
          answer.className = 'answer';
          answer.textContent = response.reply || 'No answer was returned.';
          turn.appendChild(answer);
          renderReasoning(turn, response.reasoning || response.steps);
          renderResult(turn, response.result);
          var turnData = completedTurnData(turn.querySelector('.question').textContent, response);
          if (replacing && state.turns.length) state.turns[state.turns.length - 1] = turnData;
          else state.turns.push(turnData);
          if (state.turns.length > 24) state.turns = state.turns.slice(-24);
          if (replacing) state.history = (baseHistory || []).slice();
          state.history.push({ role: 'user', content: turn.querySelector('.question').textContent });
          state.history.push({ role: 'assistant', content: response.reply || '' });
          if (state.history.length > 24) state.history = state.history.slice(-24);
          state.lastTurn = turn;
          state.lastQuestion = turn.querySelector('.question').textContent;
          if (response.context) renderContext(response.context, false);
          state.syncedFingerprint = response.context && response.context.fingerprint || state.syncedFingerprint;
          state.stale = false; state.syncError = false; state.errorAction = ''; turn.classList.remove('recalculating'); renderSyncState('current');
          threadEl.scrollTop = threadEl.scrollHeight;
        }

        function setBusy(busy) {
          state.busy = busy;
          updateComposerAvailability();
          sendEl.textContent = busy ? '…' : '↑';
        }

        function markSessionSaveError() {
          state.syncError = true;
          state.errorAction = 'save';
          renderSyncState('session-error');
        }

        async function submit() {
          if (state.busy || !state.context) return;
          var text = questionEl.value.trim();
          if (!text) return;
          questionEl.value = '';
          var turn = addUserTurn(text);
          var pendingAnswer = addPending(turn);
          var stopProgress = startPendingProgress(pendingAnswer);
          setBusy(true);
          renderSyncState('checking');
          try {
            var response = await callServer('askPrereasoner', {
              question: text,
              conversationId: state.conversationId,
              history: state.history
            });
            state.conversationId = response.conversationId || state.conversationId;
            finishTurn(turn, response);
            try {
              await persistCurrentState();
            } catch (_) {
              markSessionSaveError();
            }
          } catch (error) {
            var pending = turn.querySelector('.pending');
            if (pending) {
              pending.className = 'answer error';
              pending.setAttribute('role', 'alert');
              pending.textContent = errorText(error);
            }
            questionEl.value = text;
            questionEl.scrollTop = 0;
            renderSyncState(state.stale ? 'stale' : (state.conversationId ? 'current' : null));
          } finally {
            stopProgress();
            setBusy(false);
            questionEl.focus();
            if (questionEl.value) questionEl.scrollTop = 0;
          }
        }

        async function checkSync() {
          if (!state.conversationId || state.busy || state.restoring || state.checking ||
              (state.syncError && state.errorAction === 'save') || document.hidden) return;
          state.checking = true; renderSyncState('checking');
          try {
            var result = await callServer('syncPrereasonerConversation', {conversationId: state.conversationId});
            if (result.context) renderContext(result.context, false);
            if (result.changed) state.stale = true;
            state.syncError = false; state.errorAction = '';
            renderSyncState(state.stale ? 'stale' : 'current');
          } catch (_) {
            state.syncError = true; state.errorAction = 'sync'; renderSyncState('error');
          } finally { state.checking = false; }
        }

        async function recalculateCurrent() {
          if (state.busy || !state.stale || !state.lastTurn || !state.lastQuestion) return;
          var turn = state.lastTurn, baseHistory = state.history.slice(0, -2);
          turn.classList.add('recalculating'); setBusy(true); renderSyncState('checking');
          try {
            var response = await callServer('askPrereasoner', {
              question: state.lastQuestion, conversationId: state.conversationId, history: baseHistory
            });
            state.conversationId = response.conversationId || state.conversationId;
            finishTurn(turn, response, true, baseHistory);
            try {
              await persistCurrentState();
            } catch (_) {
              markSessionSaveError();
            }
          } catch (_) {
            turn.classList.remove('recalculating'); state.syncError = true; state.errorAction = 'recalc'; renderSyncState('error');
          } finally { setBusy(false); questionEl.focus(); }
        }

        syncStateEl.addEventListener('click', async function () {
          if (state.syncError && state.errorAction === 'clear') {
            renderSyncState('checking');
            try {
              await callServer('clearPrereasonerSheetConversation');
              state.syncError = false; state.errorAction = ''; renderSyncState(null);
            } catch (_) { renderSyncState('session-error'); }
            return;
          }
          if (state.syncError && state.errorAction === 'save') {
            renderSyncState('checking');
            try {
              await persistCurrentState();
              state.syncError = false; state.errorAction = '';
              renderSyncState(state.stale ? 'stale' : 'current');
            } catch (_) { markSessionSaveError(); }
            return;
          }
          if (state.syncError && state.errorAction === 'recalc') recalculateCurrent();
          else if (state.syncError) checkSync(); else if (state.stale) recalculateCurrent();
        });

        document.getElementById('composer').addEventListener('submit', function (event) {
          event.preventDefault();
          submit();
        });
        questionEl.addEventListener('keydown', function (event) {
          if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            submit();
          }
        });
        document.getElementById('newConversation').addEventListener('click', async function () {
          if (state.busy || state.restoring) return;
          state.conversationId = '';
          state.history = [];
          state.turns = [];
          state.stale = false; state.syncError = false; state.errorAction = ''; state.lastTurn = null; state.lastQuestion = ''; state.syncedFingerprint = '';
          threadEl.innerHTML = '';
          var fresh = document.createElement('div');
          fresh.className = 'empty';
          fresh.textContent = 'Starting a new chat…';
          threadEl.appendChild(fresh);
          questionEl.value = '';
          questionEl.scrollTop = 0;
          renderSyncState(null);
          state.restoring = true;
          updateComposerAvailability();
          try {
            await callServer('clearPrereasonerSheetConversation');
            fresh.textContent = 'Ask a question about the current sheet.';
          } catch (_) {
            fresh.textContent = 'Ask a question about the current sheet.';
            state.syncError = true; state.errorAction = 'clear'; renderSyncState('session-error');
          } finally {
            state.restoring = false;
            updateComposerAvailability();
            questionEl.focus();
          }
        });

        function restoreConversation(payload) {
          payload = payload || {};
          if (payload.context) renderContext(payload.context, false);
          state.restoring = false;
          state.conversationId = String(payload.conversationId || '');
          state.stale = !!payload.stale;
          state.history = [];
          state.turns = [];
          state.lastTurn = null;
          state.lastQuestion = '';
          threadEl.innerHTML = '';
          var saved = payload.state;
          if (state.conversationId && saved && saved.client === 'google-sheets-addon' &&
              Number(saved.version) === 1 && Array.isArray(saved.turns) && saved.turns.length) {
            state.history = Array.isArray(saved.history) ? saved.history.slice(-24) : [];
            state.turns = saved.turns.slice(-24).map(function (item) {
              return completedTurnData(item && item.question, item || {});
            });
            state.turns.forEach(function (item) { state.lastTurn = renderCompletedTurn(item); });
            state.lastQuestion = state.turns[state.turns.length - 1].question;
            renderSyncState(state.stale ? 'stale' : 'current');
            threadEl.scrollTop = threadEl.scrollHeight;
          } else if (state.conversationId) {
            var note = document.createElement('div');
            note.className = 'restore-note';
            var title = document.createElement('strong');
            title.textContent = 'Previous conversation reconnected';
            note.appendChild(title);
            note.appendChild(document.createTextNode(payload.legacyQuestion
              ? 'It started with “' + payload.legacyQuestion + '”. Earlier sidebar messages predate automatic restoration.'
              : 'Earlier sidebar messages predate automatic restoration.'));
            threadEl.appendChild(note);
            renderSyncState(null);
          } else {
            var empty = document.createElement('div');
            empty.className = 'empty';
            empty.textContent = 'Ask a question about the current sheet.';
            threadEl.appendChild(empty);
            renderSyncState(null);
          }
          updateComposerAvailability();
          questionEl.focus();
        }

        var contextRequest = INITIAL_CONTEXT && typeof INITIAL_CONTEXT === 'object'
          ? Promise.resolve(INITIAL_CONTEXT)
          : callServer('getSheetContext');
        if (emptyEl) emptyEl.textContent = 'Restoring this sheet’s conversation…';
        contextRequest.then(function (context) {
          renderContext(context, false);
          return callServer('restorePrereasonerSheetConversation');
        }).then(restoreConversation).catch(function (error) {
          state.restoring = false;
          renderContext(state.context || { error: 'Could not read this spreadsheet: ' + errorText(error) }, false);
          threadEl.innerHTML = '';
          var empty = document.createElement('div');
          empty.className = 'empty status-error';
          empty.textContent = 'Could not restore this sheet’s conversation. You can start a new chat.';
          threadEl.appendChild(empty);
          updateComposerAvailability();
        });
        window.setInterval(checkSync, 15000);
      }());
    </script>
  </body>
</html>
