<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link rel="stylesheet" href="https://ssl.gstatic.com/docs/script/css/add-ons1.css">
    <style>
      html, body { height: 100%; }
      body { margin: 0; color: #202124; font: 13px Arial, sans-serif; }
      .branding-below {
        bottom: 66px;
        top: 0;
        overflow-y: auto;
        padding: 0 16px 16px;
        box-sizing: border-box;
      }
      .topline {
        min-height: 46px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid #dadce0;
      }
      .context {
        padding: 11px 0 13px;
        color: #5f6368;
        border-bottom: 1px solid #f1f3f4;
      }
      .context strong { color: #202124; font-weight: 500; }
      .status-error { color: #b31412; }
      .empty {
        padding: 26px 0;
        color: #5f6368;
        line-height: 1.5;
      }
      .turn { margin: 14px 0 18px; }
      .question {
        display: inline-block;
        max-width: 94%;
        margin-left: 6%;
        padding: 9px 11px;
        color: #174ea6;
        background: #e8f0fe;
        border-radius: 8px;
        line-height: 1.4;
        box-sizing: border-box;
      }
      .answer {
        margin-top: 8px;
        padding: 11px;
        background: #f8f9fa;
        border: 1px solid #dadce0;
        border-radius: 8px;
        line-height: 1.45;
        white-space: pre-wrap;
      }
      .answer.pending { color: #5f6368; }
      details.reasoning {
        margin-top: 8px;
        border: 1px solid #dadce0;
        border-radius: 6px;
        overflow: hidden;
      }
      details.reasoning summary {
        padding: 8px 10px;
        color: #5f6368;
        cursor: pointer;
        list-style-position: inside;
      }
      .reasoning-body { padding: 0 10px 10px; color: #5f6368; }
      .operation { padding: 7px 0; border-top: 1px solid #f1f3f4; }
      .operation:first-child { border-top: 0; }
      .operation-label { color: #202124; font-weight: 500; }
      .operation-detail { margin-top: 3px; line-height: 1.4; }
      .result-table-wrap { margin-top: 8px; overflow-x: auto; }
      .result-table { border-collapse: collapse; width: 100%; font-size: 12px; }
      .result-table th, .result-table td {
        border: 1px solid #dadce0;
        padding: 5px 6px;
        text-align: left;
        vertical-align: top;
      }
      .result-table th { background: #f1f3f4; font-weight: 500; }
      .bottom {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        box-sizing: border-box;
        padding: 8px 12px 10px;
        background: #fff;
        border-top: 1px solid #dadce0;
      }
      .composer { display: flex; gap: 8px; align-items: flex-end; }
      .composer textarea {
        min-height: 36px;
        max-height: 112px;
        flex: 1;
        resize: vertical;
        box-sizing: border-box;
      }
      .composer button { flex: 0 0 auto; }
      .privacy { display: block; margin-top: 5px; color: #5f6368; font-size: 11px; text-decoration: none; }
      .privacy:hover { text-decoration: underline; }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    </style>
  </head>
  <body>
    <div class="sidebar branding-below">
      <div class="topline">
        <span class="gray">Sheets Copilot</span>
        <button class="button" id="newConversation" type="button">New</button>
      </div>
      <div class="context" id="context" aria-live="polite">Reading the current sheet…</div>
      <div id="thread" aria-live="polite">
        <div class="empty" id="empty">Ask a question about the current sheet.</div>
      </div>
    </div>

    <div class="sidebar bottom">
      <form class="composer" id="composer">
        <label class="sr-only" for="question">Ask about this spreadsheet</label>
        <textarea id="question" placeholder="Ask about this spreadsheet…" rows="1" disabled></textarea>
        <button class="blue" id="send" type="submit" disabled>Send</button>
      </form>
      <a class="privacy" id="privacy" href="https://chat.prereasoner.com/privacy" target="_blank">Privacy</a>
    </div>

    <script>
      var INITIAL_CONTEXT = <?!= initialContext ?>;
      (function () {
        var state = { conversationId: '', history: [], context: null, busy: false };
        var contextEl = document.getElementById('context');
        var threadEl = document.getElementById('thread');
        var emptyEl = document.getElementById('empty');
        var questionEl = document.getElementById('question');
        var sendEl = document.getElementById('send');
        var privacyEl = document.getElementById('privacy');

        function esc(value) {
          var node = document.createElement('div');
          node.textContent = value == null ? '' : String(value);
          return node.innerHTML;
        }

        function callServer(name, arg) {
          return new Promise(function (resolve, reject) {
            var runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
            if (arg === undefined) runner[name]();
            else runner[name](arg);
          });
        }

        function errorText(error) {
          var message = (error && (error.message || error.toString())) || 'The add-on could not read this spreadsheet.';
          if (/server error occurred while reading from storage|PERMISSION_DENIED/i.test(message)) {
            return 'Google could not run this sidebar in the current account session. If you are signed in to multiple Google accounts, open this sheet in a single-account window and authorize Prereasoner again.';
          }
          return message;
        }

        function renderContext(context) {
          state.context = context;
          if (!context || context.error) {
            contextEl.className = 'context status-error';
            contextEl.textContent = context && context.error
              ? context.error
              : 'Could not read this spreadsheet. Reload the sidebar after authorizing the add-on.';
            questionEl.disabled = true;
            sendEl.disabled = true;
            return;
          }
          var name = context.activeSheet || 'current sheet';
          var tabs = Number(context.tableCount || (context.tables && context.tables.length) || 1);
          var rows = Number(context.totalRows || 0);
          contextEl.className = 'context';
          contextEl.innerHTML = 'Using data from <strong>' + esc(name) + '</strong>' +
            (tabs > 1 ? ' · ' + tabs + ' tabs' : '') +
            (rows ? ' · ' + rows + ' rows' : '');
          if (context.privacyUrl) privacyEl.href = context.privacyUrl;
          questionEl.disabled = false;
          sendEl.disabled = false;
          questionEl.focus();
        }

        function addUserTurn(text) {
          var turn = document.createElement('div');
          turn.className = 'turn';
          turn.innerHTML = '<div class="question">' + esc(text) + '</div>';
          threadEl.appendChild(turn);
          return turn;
        }

        function addPending(turn) {
          var answer = document.createElement('div');
          answer.className = 'answer pending';
          answer.textContent = 'Thinking…';
          turn.appendChild(answer);
          return answer;
        }

        function renderReasoning(turn, reasoning) {
          if (!reasoning || !reasoning.length) return;
          var details = document.createElement('details');
          details.className = 'reasoning';
          var firstQuestion = turn.querySelector('.question').textContent;
          details.innerHTML = '<summary>Reasoning steps for <strong>' + esc(firstQuestion) + '</strong></summary>' +
            '<div class="reasoning-body">' + reasoning.map(function (step) {
              return '<div class="operation"><div class="operation-label">' + esc(step.label || 'Step') + '</div>' +
                (step.detail ? '<div class="operation-detail">' + esc(step.detail) + '</div>' : '') + '</div>';
            }).join('') + '</div>';
          turn.appendChild(details);
        }

        function renderResult(turn, result) {
          if (!result || !Array.isArray(result.rows) || !result.rows.length) return;
          var headers = Array.isArray(result.headers) ? result.headers : (Array.isArray(result.columns) ? result.columns : []);
          var wrap = document.createElement('div');
          wrap.className = 'result-table-wrap';
          var html = '<table class="result-table"><thead><tr>' + headers.map(function (h) {
            return '<th>' + esc(h) + '</th>';
          }).join('') + '</tr></thead><tbody>';
          html += result.rows.map(function (row) {
            return '<tr>' + row.map(function (cell) { return '<td>' + esc(cell) + '</td>'; }).join('') + '</tr>';
          }).join('') + '</tbody></table>';
          wrap.innerHTML = html;
          turn.appendChild(wrap);
        }

        function finishTurn(turn, response) {
          var pending = turn.querySelector('.pending');
          if (pending) pending.remove();
          var answer = document.createElement('div');
          answer.className = 'answer';
          answer.textContent = response.reply || 'No answer was returned.';
          turn.appendChild(answer);
          renderReasoning(turn, response.reasoning || response.steps);
          renderResult(turn, response.result);
          state.history.push({ role: 'user', content: turn.querySelector('.question').textContent });
          state.history.push({ role: 'assistant', content: response.reply || '' });
          if (state.history.length > 24) state.history = state.history.slice(-24);
          threadEl.scrollTop = threadEl.scrollHeight;
        }

        function setBusy(busy) {
          state.busy = busy;
          questionEl.disabled = busy || !state.context;
          sendEl.disabled = busy || !state.context;
          sendEl.textContent = busy ? '…' : 'Send';
        }

        async function submit() {
          if (state.busy || !state.context) return;
          var text = questionEl.value.trim();
          if (!text) return;
          questionEl.value = '';
          var turn = addUserTurn(text);
          addPending(turn);
          setBusy(true);
          try {
            var response = await callServer('askPrereasoner', {
              question: text,
              conversationId: state.conversationId,
              history: state.history
            });
            state.conversationId = response.conversationId || state.conversationId;
            finishTurn(turn, response);
          } catch (error) {
            var pending = turn.querySelector('.pending');
            if (pending) pending.textContent = errorText(error);
          } finally {
            setBusy(false);
            questionEl.focus();
          }
        }

        document.getElementById('composer').addEventListener('submit', function (event) {
          event.preventDefault();
          submit();
        });
        questionEl.addEventListener('keydown', function (event) {
          if (event.key === 'Enter' && (event.metaKey || event.ctrlKey)) {
            event.preventDefault();
            submit();
          }
        });
        document.getElementById('newConversation').addEventListener('click', function () {
          state.conversationId = '';
          state.history = [];
          threadEl.innerHTML = '';
          var fresh = document.createElement('div');
          fresh.className = 'empty';
          fresh.textContent = 'Ask a question about the current sheet.';
          threadEl.appendChild(fresh);
          questionEl.focus();
        });

        var contextRequest = INITIAL_CONTEXT && typeof INITIAL_CONTEXT === 'object'
          ? Promise.resolve(INITIAL_CONTEXT)
          : callServer('getSheetContext');
        contextRequest.then(renderContext).catch(function (error) {
          renderContext({ error: 'Could not read this spreadsheet: ' + errorText(error) });
        });
      }());
    </script>
  </body>
</html>
