# PreReasoner CI: lightweight deterministic behavior and structural checks.
# Public CI runs the deterministic suites with requirements-ci.txt. Model-backed and live
# Postgres tests remain deployment gates because weights and seeded source data are external.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-hermetic:
    name: Python lint + hermetic suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Ruff fatal checks
        run: python -m ruff check engine db training tests orchestrator mcp_server regress --select F,E9
      - name: py_compile all python sources
        run: python -m compileall -q engine db training tests orchestrator mcp_server regress
      - name: Run hermetic Python suites
        env:
          RUN_ENGINE_TESTS: "0"
          RUN_ORCHESTRATOR_TESTS: "0"
        run: python -m tests.run_all

  web-static:
    name: Web JS parse + Firebase config JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: node --check frontend libs
        run: |
          set -e
          for f in web/public/lib/*.js; do
            echo "checking $f"
            node --check "$f"
          done
          node web/tests/workbook_reference.test.js
      # database.rules.json is JSONC (Firebase tooling allows /* */ comments in rules
      # files), so strip block comments before the strict JSON.parse.
      - name: validate firebase.json / database.rules.json
        run: |
          set -e
          node -e "JSON.parse(require('fs').readFileSync('web/firebase.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('web/database.rules.json', 'utf8').replace(/\/\*[\s\S]*?\*\//g, ''))"
          echo "firebase configs OK"

  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff infra
      # -backend=false: no state backend, no cloud credentials — pure config validation.
      - name: terraform validate
        working-directory: infra
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: terraform optional-orchestrator contract
        working-directory: infra
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: offline-plan-placeholder
        run: |
          terraform plan -refresh=false -lock=false -input=false \
            -var='project_id=opensource-ci' -out=/tmp/default.tfplan
          terraform show -json /tmp/default.tfplan > /tmp/default.json
          jq -e '[.resource_changes[] | select(.address | test("chat|anthropic"))] | length == 0' \
            /tmp/default.json
          if terraform plan -refresh=false -lock=false -input=false \
            -var='project_id=opensource-ci' -var='enable_orchestrator=true' \
            -out=/tmp/invalid.tfplan; then
            echo "expected enable_orchestrator without anthropic_api_key to fail" >&2
            exit 1
          fi
