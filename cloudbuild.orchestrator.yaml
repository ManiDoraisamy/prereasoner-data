# Build + push the orchestrator (Sonnet chat backend + Prereasoner MCP server) image, GATED on tests.
#
#   gcloud builds submit --config cloudbuild.orchestrator.yaml \
#     --substitutions=_REGION=us-central1,_REPO=prereasoner,_TAG=latest
#
# The `test` step runs the two suites compatible with this lean image before building. `test_mcp`
# always runs; `test_orchestrator` self-skips unless ANTHROPIC_API_KEY is provided. Repository CI owns
# the full hermetic suite, and the release-database regression remains a separate deployment gate.
# A focused failure here still stops the chat image from being pushed.

steps:
  - id: test
    name: python:3.11@sha256:a8677eb08a56d04e75df938f9d2af3d50c0f0fba17af8eb9c8e41b65fa32938d
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        pip install --no-cache-dir -r orchestrator/requirements.txt
        # Only the suites this LEAN image can run: the MCP contract (always) + the orchestrator routing
        # discipline (self-skips unless ANTHROPIC_API_KEY is wired in as a substitution). The engine suites
        # (test_sql_ast / test_world / ...) need torch/numpy/psycopg — absent here by design — and gate the
        # engine build (cloudbuild.yaml) instead. A failing suite here still fails the build.
        python -m tests.test_mcp
        python -m tests.test_orchestrator

  - id: build
    name: gcr.io/cloud-builders/docker@sha256:e85f8f20f7b533e74a4b1be279b9ff2b45dcc20ab97de9b302c26715a9d9ffc8
    args:
      - build
      - -f
      - Dockerfile.orchestrator
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/chat:${_TAG}
      - .

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/chat:${_TAG}

substitutions:
  _REGION: us-central1   # must match infra/ var.region
  _REPO: prereasoner     # must match infra/ var.artifact_repo
  _TAG: latest

timeout: 900s
