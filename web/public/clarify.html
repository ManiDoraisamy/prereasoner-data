<!doctype html><html lang=en><head>
<meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Prereasoner · clarify</title>
<meta name="description" content="The model wasn't sure what your question meant, so instead of guessing a wrong answer it shows its best interpretation for you to confirm or edit.">
<link rel=preconnect href="https://fonts.googleapis.com"><link rel=preconnect href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel=stylesheet>
<link rel=stylesheet href="styles.css">
<style>
.cwrap{max-width:600px;margin:12vh auto 0;padding:0 22px}
.cwarn{display:flex;align-items:center;gap:8px;color:rgba(255,255,255,.85);font-style:italic;font-size:15px;margin-bottom:10px}
.corig{font-weight:600;font-size:21px;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:12px 16px;margin-bottom:26px}
.cask{color:rgba(255,255,255,.9);font-weight:600;font-size:15px;margin:0 2px 9px}
.chip{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid #ece6fb;border-radius:10px;padding:6px 12px 6px 7px;min-width:0}
.chip .ic{width:23px;height:23px;display:flex;align-items:center;justify-content:center;background:#f3effd;border-radius:6px;font-size:12px}
.chip .nm{font-weight:600;font-size:12.5px;color:#2a2342;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.attachbar{flex-wrap:nowrap}
.send{all:unset;cursor:pointer;width:36px;height:36px;border-radius:10px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;margin-left:auto;flex:0 0 auto;box-shadow:0 4px 14px rgba(40,12,140,.30);transition:background .16s,transform .16s}
.send:hover{background:var(--brand-deep);transform:translateY(-1px)}
.send svg{width:18px;height:18px}
/* ⓘ popup — holds the avoided query + how I read it */
.infobtn{background:rgba(255,255,255,.18);color:#fff;border:0;width:24px;height:24px;border-radius:50%;cursor:pointer;font-size:14px;line-height:1;margin-left:auto}
.backdrop{display:none;position:fixed;inset:0;background:rgba(20,12,48,.45);z-index:40}
.infocard{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:41;background:#fff;border-radius:14px;padding:20px 24px;max-width:460px;width:90%;box-shadow:0 20px 60px rgba(20,12,48,.3);font-size:13px;color:#333;line-height:1.5}
.ih{font-weight:700;color:#1c1340;margin:2px 0 7px}.ih2{font-weight:700;color:#1c1340;margin:16px 0 7px}
.avoided{font:12px var(--mono);color:#8a8398;background:#f6f4fc;border-radius:9px;padding:9px 12px;white-space:pre-wrap;word-break:break-word}
.bind{display:inline-flex;align-items:center;gap:6px;background:#faf8ff;border:1px solid #ece6fb;border-radius:9px;padding:5px 10px;font-size:12.5px;color:#2a2342;margin:0 6px 6px 0}
.bind .k{color:var(--brand);font-weight:600}.bind .s{color:#b3acce;font:11px var(--mono)}
</style>
</head><body>
<div class=page>
  <div class=hdr><a class=brand href="/"><img class=logo src="login_logo.svg" alt=""><span>Prereasoner</span></a><div class=spacer></div><button class=ghost onclick="location.href='/'">Start over</button></div>
  <div class=cwrap>
    <div class=cwarn><span>&#9888;&#65039;</span> <span>I wasn&rsquo;t sure what you meant by</span><button class=infobtn id=infobtn title="Why?" onclick=toggleInfo()>&#9432;</button></div>
    <div class=corig id=corig></div>
    <div class=cask>Did you mean?</div>
    <form id=f>
      <div class=promptcard>
        <textarea class=qbox id=q spellcheck=false></textarea>
        <div class=attachbar>
          <span id=chips style="display:flex;gap:7px;flex-wrap:wrap;align-items:center"></span>
          <button class=send type=submit aria-label="Run"><svg viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width="2.4" stroke-linecap=round stroke-linejoin=round><line x1=12 y1=20 x2=12 y2=5></line><polyline points="6 11 12 5 18 11"></polyline></svg></button>
        </div>
      </div>
    </form>
  </div>
  <div class=backdrop id=backdrop onclick=closeInfo()></div>
  <div class=infocard id=infocard>
    <div class=ih>Instead of guessing, I stopped</div>
    <div class=avoided id=avoided></div>
    <div class=ih2>How I read your words</div>
    <div id=binds></div>
  </div>
</div>
<script src="lib/shared.js"></script>
<script>
const $=id=>document.getElementById(id);
function toggleInfo(){const o=$('infocard').style.display==='block';$('infocard').style.display=o?'none':'block';$('backdrop').style.display=o?'none':'block';}
function closeInfo(){$('infocard').style.display='none';$('backdrop').style.display='none';}
let C={}, SHEETS=[];
try{ C=JSON.parse(sessionStorage.getItem(SS.CLARIFY)||'{}'); }catch(_){}
try{ const t=sessionStorage.getItem(SS.TABLES); if(t)SHEETS=JSON.parse(t)||[]; }catch(_){}
if(!C||!C.proposed){ location.href='/'; }
else{
  $('corig').textContent=C.question||C.original||'';
  $('q').value=C.proposed||'';
  $('chips').innerHTML=SHEETS.map(s=>'<span class=chip><span class=ic>&#128196;</span><span class=nm>'+esc(s.name)+'</span></span>').join('');
  $('avoided').textContent=(C.original_sql||'').replace(/\s+/g,' ').trim()||'(no query)';
  const bs=(C.bindings||[]);
  $('binds').innerHTML=bs.length?bs.map(b=>'<span class=bind><span>'+esc(b.token||'')+'</span> &rarr; <span class=k>'+esc(b.target||'')+'</span>'+(b.op?' <span class=s>'+esc(b.op)+'</span>':'')+(b.score!=null?' <span class=s>'+b.score+'</span>':'')+'</span>').join(''):'<span class=bind>&mdash;</span>';
  $('q').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('f').requestSubmit();}});
  $('f').addEventListener('submit',e=>{
    e.preventDefault();
    const q=$('q').value.trim(); if(!q)return;
    try{ sessionStorage.setItem(SS.Q,q); sessionStorage.removeItem(SS.CLARIFY); }catch(_){}
    location.href='world';
  });
  setTimeout(()=>{try{$('q').focus();$('q').setSelectionRange($('q').value.length,$('q').value.length);}catch(_){}},60);
}
</script></body></html>
