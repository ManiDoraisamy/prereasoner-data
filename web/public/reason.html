<!doctype html><html lang=en><head>
<meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Prereasoner · workbook</title>
<link rel=preconnect href="https://fonts.googleapis.com"><link rel=preconnect href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel=stylesheet>
<link rel=stylesheet href="/styles.css?v=13">
</head><body class=app>
<!-- The read-only WORKBOOK (shared logic: lib/workbook.js; shared styles: styles.css).
     Green sheets = the user's tables (the AI never writes here). Blue sheets = one per
     reasoning step. Grey sheets = the reference lookups it used. -->
<div class=screen>
  <div class=hdr>
    <button class=menubtn id=menubtn aria-label="Conversations" onclick=openDrawer()><svg viewBox="0 0 24 24" width=20 height=20 aria-hidden=true><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width=2 stroke-linecap=round fill=none/></svg></button>
    <div class=htitle id=htitle title=""></div>
    <div class=spacer></div>
    <a class=ghost href="/" style="text-decoration:none" onclick="newConversation();return false">+ New</a>
  </div>
  <div class=drawer-backdrop id=drawerback onclick=closeDrawer()></div>
  <aside class=drawer id=drawer aria-label="Conversations">
    <div class=drawerhd><span>Conversations</span><button class=drawerx onclick=closeDrawer() aria-label=Close>&times;</button></div>
    <button class=convnew onclick="newConversation()">+ New conversation</button>
    <div class=convlist id=convlist></div>
  </aside>
  <div class=workmain>
    <div class=sheetside>
      <div class=sheetcard id=sheetcard>
        <div class=sheetmsg id=sheetmsg><span class=spin></span> Loading your data…</div>
      </div>
      <div class=tabsbar>
        <button class=tabarrow id=tabL onclick=scrollTabs(-1) aria-label="Previous sheets" disabled>&#8249;</button>
        <button class=tabarrow id=tabR onclick=scrollTabs(1) aria-label="Next sheets" disabled>&#8250;</button>
        <div class=tabscroll id=tabstrip></div>
      </div>
    </div>
    <div class=rail>
      <div class=railscroll id=rail></div>
      <div class=chatbar>
        <textarea id=chatq rows=1 placeholder="Ask a follow-up…"></textarea>
        <button id=chatsend class=sendbtn aria-label=Send disabled>&#8593;</button>
      </div>
    </div>
  </div>
</div>
<script src="/lib/shared.js"></script>
<script>
window.WB_CONFIG = { endpoint: '/api/reason' };   // reason: composition over the uploaded sheets (+world joins)
</script>
<script src="/lib/workbook.js"></script>
<script type="module">
// ensureSignedIn resolves the uid, resolves null when redirecting to Google, and THROWS when a
// redirect came back without a session (the loop-breaker) — show that instead of looping.
import { ensureSignedIn } from "/lib/firebase-init.js";
try { if (await ensureSignedIn()) run(); }
catch (e) { fail((e && e.message) || 'Google sign-in did not complete — please try again.'); }
</script></body></html>
