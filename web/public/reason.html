<!doctype html><html lang=en><head>
<meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Prereasoner · workbook</title>
<link rel=preconnect href="https://fonts.googleapis.com"><link rel=preconnect href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel=stylesheet>
<link rel=stylesheet href="styles.css?v=9">
<style>
/* ---- read-only WORKBOOK on the FormFacade design system (styles.css tokens only) ----
   Left: the spreadsheet (white .gridcard sheet + bottom tab strip). Right: the chat rail.
   Sheet classes: green = the user's input tables (never touched by the AI), blue = the AI's
   derivation sheets (one per view step), grey = reference tables the resolution used
   (hidden behind a toggle). */
.spin{display:inline-block;width:13px;height:13px;border:2.5px solid #d9d2f3;border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite;flex:0 0 auto}@keyframes sp{to{transform:rotate(360deg)}}
.workmain{flex:1;min-height:0;display:flex;gap:18px;padding:4px 26px 18px}
.sheetside{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}

/* the active sheet */
.sheetcard{flex:1;min-height:0;background:#fff;border-radius:14px;box-shadow:0 18px 50px rgba(40,12,140,.28);display:flex;flex-direction:column;overflow:hidden}
.sheetband{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid #efeafa}
.sheetband .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.sheetband .snm{font:600 13px var(--mono);color:var(--card-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheetband .skind{font:600 9.5px var(--mono);letter-spacing:1.1px;text-transform:uppercase;padding:3px 9px;border-radius:9999px;flex:0 0 auto}
.sheetband .slabel{font:12px var(--disp);color:var(--card-ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.sqlbtn{all:unset;cursor:pointer;font:600 10.5px var(--mono);letter-spacing:.8px;color:var(--brand);padding:4px 10px;border:1px solid #ddd4f5;border-radius:9999px;flex:0 0 auto}
.sqlbtn:hover{background:#f3effd}
.sqlrow{display:none;flex:0 0 auto;padding:9px 16px;border-bottom:1px solid #efeafa;background:#faf9ff}
.sqlrow.open{display:block}
.vsql{display:flex;flex-wrap:wrap;gap:4px}.vtok{background:#4a2db5;color:#fff;border-radius:6px;padding:2px 7px;font:600 11px var(--mono)}
.vtok.kw{background:#7c3aed}.vtok.world{background:#c026d3}.vtok.lit{background:#d6336c}.vtok.tbl{background:#0891b2}
.sheetscroll{flex:1;min-height:0;overflow:auto}
.sheetscroll::-webkit-scrollbar{height:9px;width:9px}.sheetscroll::-webkit-scrollbar-thumb{background:#d9d2f3;border-radius:6px}.sheetscroll::-webkit-scrollbar-track{background:transparent}
table.wb{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
.wb th,.wb td{border-right:1px solid #efeafa;border-bottom:1px solid #efeafa;padding:7px 12px;text-align:left;vertical-align:top;white-space:nowrap;max-width:360px;overflow:hidden;text-overflow:ellipsis}
.wb th{position:sticky;top:0;z-index:2;background:#f3effd;color:var(--brand);font:600 12px var(--mono);letter-spacing:.3px}
.wb th.rn,.wb td.rn{position:sticky;left:0;z-index:1;background:#faf9ff;color:#b3acce;text-align:center;font:12px var(--mono);min-width:40px;max-width:40px}
.wb th.rn{z-index:3;background:#f3effd}
.wb td{font-family:var(--mono);color:var(--card-ink)}
.wb td.n,.wb th.n{text-align:right;font-variant-numeric:tabular-nums}
.wb.result td{color:#4a2db5;font-weight:600}
.capnote{padding:8px 16px;font:11.5px var(--mono);color:var(--card-ink-dim);border-top:1px solid #efeafa}
.sheetmsg{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--card-ink-dim);font:600 13px var(--mono);padding:30px}

/* bottom tab strip (the workbook's sheets) */
.tabstrip{flex:0 0 auto;display:flex;align-items:center;gap:7px;overflow-x:auto;padding:2px 2px 4px}
.tabstrip::-webkit-scrollbar{height:7px}.tabstrip::-webkit-scrollbar-thumb{background:rgba(255,255,255,.35);border-radius:6px}.tabstrip::-webkit-scrollbar-track{background:transparent}
.wtab{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:8px 15px;border-radius:10px 10px 3px 3px;background:rgba(255,255,255,.16);color:#fff;font:600 12px var(--mono);white-space:nowrap;transition:background .14s}
.wtab:hover{background:rgba(255,255,255,.30)}
.wtab.active{background:#fff;color:var(--card-ink);box-shadow:0 8px 22px rgba(40,12,140,.25)}
.wtab .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.dot.input{background:#27b57e}.dot.deriv{background:#8f7bf2}.dot.ref{background:#b9b3cf}
.wtab.active .dot.deriv{background:var(--brand)}
.skind.input{background:#e2f6ec;color:#177a53}.skind.deriv{background:#eee9fc;color:var(--brand)}.skind.ref{background:#f0eef6;color:#6f6a87}
.band-input{background:#27b57e}.band-deriv{background:var(--brand)}.band-ref{background:#b9b3cf}
.bandbar{height:4px;flex:0 0 auto}
.tabsep{width:1px;height:22px;background:rgba(255,255,255,.35);flex:0 0 auto;margin:0 3px}
.reftoggle{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:10px;color:rgba(255,255,255,.85);font:600 11.5px var(--mono);white-space:nowrap}
.reftoggle:hover{background:rgba(255,255,255,.16)}

/* right rail — the chat / "what I did" panel (Excel-Copilot side, but ours) */
.rail{flex:0 0 340px;max-width:340px;background:#fff;border-radius:14px;box-shadow:0 18px 50px rgba(40,12,140,.28);display:flex;flex-direction:column;min-height:0}
.railhdr{flex:0 0 auto;padding:13px 18px;border-bottom:1px solid #efeafa;font:600 10.5px var(--mono);letter-spacing:1.6px;text-transform:uppercase;color:var(--card-ink-dim)}
.railscroll{flex:1;min-height:0;overflow-y:auto;padding:14px 18px}
.railscroll::-webkit-scrollbar{width:8px}.railscroll::-webkit-scrollbar-thumb{background:#d9d2f3;border-radius:6px}
.turn{margin-bottom:14px}
.turn .who{font:600 9.5px var(--mono);letter-spacing:1.3px;text-transform:uppercase;color:var(--card-ink-dim);margin-bottom:5px}
.turn .msg{font:14px/1.5 var(--disp);color:var(--card-ink);background:#f3effd;border:1px solid #ddd4f5;border-radius:11px;padding:10px 13px;white-space:pre-wrap;word-break:break-word}
.turn.ai .msg{background:#faf9ff;border-color:#efeafa}
.statusline{display:flex;align-items:center;gap:9px;font:600 12.5px var(--mono);color:var(--card-ink-dim);padding:2px 1px;min-height:20px}
.steps{display:flex;flex-direction:column;gap:5px;margin-top:9px}
.steplink{all:unset;cursor:pointer;display:flex;align-items:center;gap:9px;padding:7px 10px;border:1px solid #efeafa;border-radius:9px;font:13px var(--disp);color:var(--card-ink)}
.steplink:hover{border-color:var(--brand);background:#faf9ff}
.steplink.on{border-color:var(--brand);background:#f3effd}
.steplink .idx{font:600 10.5px var(--mono);color:#fff;background:#8f7bf2;border-radius:6px;min-width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.steplink.refl .idx{background:#b9b3cf}
.steplink .stx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.resultline{margin-top:12px;padding:12px 14px;border-radius:11px;background:#eee9fc;border:1px solid #ddd4f5}
.resultline .rk{font:600 9.5px var(--mono);letter-spacing:1.3px;text-transform:uppercase;color:var(--brand);margin-bottom:4px}
.resultline .rv{font:600 22px var(--disp);color:var(--card-ink);letter-spacing:-.4px;word-break:break-word}
.resultline .rv.small{font-size:14px;font-weight:500}
.warn{margin-top:9px;padding:9px 12px;border-radius:9px;background:#fdf3e6;border:1px solid #f5ddb8;color:#8a5a13;font:12px/1.45 var(--disp)}
.failbox{margin-top:9px;padding:11px 13px;border-radius:9px;background:#fdeaea;border:1px solid #f2c4c4;color:#8f2020;font:13px/1.5 var(--disp)}
.retry{all:unset;cursor:pointer;display:inline-block;margin-top:9px;padding:7px 16px;background:var(--brand);color:#fff;border-radius:9999px;font:600 11px var(--mono);letter-spacing:1px;text-transform:uppercase}

@media(max-width:880px){
  .workmain{flex-direction:column;padding:4px 12px 12px;gap:10px}
  .rail{flex:0 0 auto;max-width:none;max-height:42vh}
  .sheetside{min-height:46vh}
}
</style>
</head><body>
<div class=screen>
  <div class=hdr><a class=brand href="/"><img class=logo src="login_logo.svg" alt=""><span>Prereasoner</span></a><div class=spacer></div>
    <a class=ghost href="/" style="text-decoration:none">+ New</a></div>
  <div class=workmain>
    <div class=sheetside>
      <div class=sheetcard id=sheetcard>
        <div class=sheetmsg id=sheetmsg><span class=spin></span> Loading your data…</div>
      </div>
      <div class=tabstrip id=tabstrip></div>
    </div>
    <div class=rail>
      <div class=railhdr>Prereasoner</div>
      <div class=railscroll id=rail></div>
    </div>
  </div>
</div>
<script src="lib/shared.js"></script>
<script>
const $=id=>document.getElementById(id);
function getSheets(){
  try{const t=sessionStorage.getItem(SS.TABLES);if(t){const a=JSON.parse(t);if(a&&a.length)return a;}}catch(_){}
  return [{name:'customers.csv',data:'customer_id,name,city\n1,Ada,Paris\n2,Lin,Lyon\n3,Bo,Paris\n4,Sam,Berlin\n5,Mai,Lyon'},
          {name:'orders.csv',data:'order_id,customer_id,amount,status\n101,1,120,shipped\n102,1,60,shipped\n103,2,80,shipped\n104,2,160,shipped\n105,3,90,shipped\n106,4,40,pending\n107,5,200,shipped\n108,5,30,shipped'}];
}
function getQ(){try{const q=sessionStorage.getItem(SS.Q);if(q)return q;}catch(_){}return 'top 3 cities by total amount';}
const SHEETS=getSheets(), question=getQ();
const TABNAMES=SHEETS.map((s,i)=>slug(s.name,i));
const MAX_RENDER_ROWS=500;

/* ---------------- workbook state ----------------
   BOOK = ordered sheet metas {id, cls:'input'|'deriv'|'ref', name, label, cols, rows, sql, result}.
   Greens first (the user's tables), blues appended as view steps stream in, greys collected
   separately behind the Reference toggle. AUTO = follow the newest sheet until the user clicks
   a tab (then they drive). SETTLED/DONE/SEEN: identical run-state semantics to the previous
   trace player (terminal state settles once; RTDB resync re-delivery is deduped). */
let BOOK=[],ACTIVE=null,AUTO=true,REF_OPEN=false;
let J=null,VIEWS=[],RESOLVES=[],SETTLED=false,DONE=false,UNSUB=null,doneTimer=null,STATUS='Analyzing input…',FAILMSG=null;
const SEEN=new Set(),SEEN_R=new Set();

function sheetById(id){return BOOK.find(s=>s.id===id);}
function addSheet(m){ BOOK.push(m); if(m.cls!=='ref'&&AUTO) ACTIVE=m.id; if(m.cls==='ref'&&!ACTIVE) ACTIVE=m.id; paint(); }

/* ---------------- rendering ---------------- */
function isNum(v){return v!==''&&v!=null&&/^-?\$?[\d,]*\.?\d+%?$/.test(String(v).trim());}
function fmt(v){ if(typeof v==='number'&&!Number.isInteger(v)) return (Math.round(v*1000)/1000).toString(); return v==null?'':String(v); }
function renderGrid(m){
  const cols=m.cols||[],rows=(m.rows||[]);
  const numeric=cols.map((_,ci)=>rows.length>0&&rows.every(r=>r[ci]===''||r[ci]==null||isNum(r[ci])));
  const shown=rows.slice(0,MAX_RENDER_ROWS);
  let h='<div class=sheetscroll><table class="wb'+(m.result?' result':'')+'"><thead><tr><th class=rn></th>';
  for(let ci=0;ci<cols.length;ci++) h+='<th'+(numeric[ci]?' class=n':'')+'>'+esc(cols[ci])+'</th>';
  h+='</tr></thead><tbody>';
  for(let ri=0;ri<shown.length;ri++){ h+='<tr><td class=rn>'+(ri+1)+'</td>';
    for(let ci=0;ci<cols.length;ci++) h+='<td'+(numeric[ci]?' class=n':'')+'>'+esc(fmt(shown[ri][ci]))+'</td>';
    h+='</tr>'; }
  if(!rows.length) h+='<tr><td class=rn>1</td><td colspan='+Math.max(1,cols.length)+' style="color:#9a93b5">no rows</td></tr>';
  h+='</tbody></table></div>';
  if(rows.length>MAX_RENDER_ROWS) h+='<div class=capnote>showing the first '+MAX_RENDER_ROWS+' of '+rows.length+' rows</div>';
  return h;
}
function tokCls(tk){const u=tk.toUpperCase();
  if(['SELECT','SUM','COUNT','AVG','MIN','MAX','FROM','JOIN','LEFT','ON','WHERE','AND','OR','GROUP','BY','ORDER','LIMIT','DESC','ASC','AS','IS','NULL','NULLIF'].includes(u))return 'kw';
  if(/^'/.test(tk))return 'lit';
  const m=tk.match(/^"([^"]+)"$/); if(m&&TABNAMES.includes(m[1].toLowerCase()))return 'tbl';
  if(/world|meaning/i.test(tk))return 'world';
  return '';}
const KINDLBL={input:'Your data',deriv:'AI derived',ref:'Reference'};
function renderSheet(){
  const m=sheetById(ACTIVE);
  if(!m){ $('sheetcard').innerHTML='<div class=sheetmsg id=sheetmsg>'+(FAILMSG?'&#9888; '+esc(FAILMSG):'<span class=spin></span> '+esc(STATUS))+'</div>'; return; }
  let h='<div class="bandbar band-'+m.cls+'"></div><div class=sheetband>'
    +'<span class="dot '+m.cls+'"></span><span class=snm>'+esc(m.name)+'</span>'
    +'<span class="skind '+m.cls+'">'+(m.result?'Result':KINDLBL[m.cls])+'</span>'
    +'<span class=slabel>'+esc(m.label||'')+'</span>'
    +(m.sql?'<button class=sqlbtn onclick=toggleSql()>SQL</button>':'')
    +'</div>';
  if(m.sql) h+='<div class=sqlrow id=sqlrow><div class=vsql>'+sqlTokens(m.sql).map(tk=>'<span class="vtok '+tokCls(tk)+'">'+esc(tk)+'</span>').join('')+'</div></div>';
  h+=renderGrid(m);
  $('sheetcard').innerHTML=h;
}
function toggleSql(){const r=$('sqlrow'); if(r) r.classList.toggle('open');}
function renderTabs(){
  const main=BOOK.filter(s=>s.cls!=='ref'), refs=BOOK.filter(s=>s.cls==='ref');
  let h=main.map(s=>'<button class="wtab'+(s.id===ACTIVE?' active':'')+'" onclick="pick(\''+s.id+'\')"><span class="dot '+s.cls+'"></span>'+esc(s.result?'Result':s.name)+'</button>').join('');
  if(refs.length){
    h+='<span class=tabsep></span><button class=reftoggle onclick=toggleRefs()>'+(REF_OPEN?'&#9662;':'&#9656;')+' Reference ('+refs.length+')</button>';
    if(REF_OPEN) h+=refs.map(s=>'<button class="wtab'+(s.id===ACTIVE?' active':'')+'" onclick="pick(\''+s.id+'\')"><span class="dot ref"></span>'+esc(s.name)+'</button>').join('');
  }
  $('tabstrip').innerHTML=h;
}
function pick(id){ AUTO=false; ACTIVE=id; const m=sheetById(id); if(m&&m.cls==='ref') REF_OPEN=true; paint(); }
function toggleRefs(){ REF_OPEN=!REF_OPEN; renderTabs(); }

function resultSummary(){
  const r=(J&&J.result)||null; if(!r||!r.rows||!r.rows.length) return null;
  if(r.rows.length===1&&r.columns&&r.columns.length===1) return {k:r.columns[0],v:fmt(r.rows[0][0]),big:true};
  if(r.rows.length===1) return {k:'result',v:r.columns.map((c,i)=>c+': '+fmt(r.rows[0][i])).join('  ·  '),big:false};
  return {k:'result',v:r.rows.length+' rows — see the Result sheet',big:false};
}
function renderRail(){
  let h='<div class=turn><div class=who>You</div><div class=msg>'+esc(question)+'</div></div>';
  h+='<div class="turn ai"><div class=who>Prereasoner</div>';
  if(FAILMSG){ h+='<div class=failbox>'+esc(FAILMSG)+'<br><button class=retry onclick=location.reload()>Retry</button></div></div>'; $('rail').innerHTML=h; return; }
  h+='<div class=statusline>'+(SETTLED?'&#10003; ':'<span class=spin></span> ')+esc(STATUS)+'</div>';
  const derivs=BOOK.filter(s=>s.cls==='deriv'), refs=BOOK.filter(s=>s.cls==='ref');
  if(derivs.length){
    h+='<div class=steps>'+derivs.map((s,i)=>'<button class="steplink'+(s.id===ACTIVE?' on':'')+'" onclick="pick(\''+s.id+'\')"><span class=idx>'+(i+1)+'</span><span class=stx>'+esc(s.label||s.name)+'</span></button>').join('')+'</div>';
  }
  if(refs.length){
    h+='<div class=steps>'+refs.map(s=>'<button class="steplink refl'+(s.id===ACTIVE?' on':'')+'" onclick="pick(\''+s.id+'\')"><span class=idx>&#9707;</span><span class=stx>looked up '+esc(s.name)+'</span></button>').join('')+'</div>';
  }
  if(SETTLED){ const rs=resultSummary();
    if(rs) h+='<div class=resultline><div class=rk>'+esc(rs.k)+'</div><div class="rv'+(rs.big?'':' small')+'">'+esc(rs.v)+'</div></div>';
  }
  ((J&&J.warnings)||[]).forEach(w=>{ h+='<div class=warn>&#9888; '+esc(String(w))+'</div>'; });
  h+='</div>';
  $('rail').innerHTML=h;
}
function paint(){ renderTabs(); renderSheet(); renderRail(); }
function fail(m){ FAILMSG=String(m||'something went wrong'); STATUS='failed'; paint(); }

/* ---------------- the run (streaming + fallbacks — same contract as before) ---------------- */
const ENDPOINT=API_BASE+'/api/reason';
function seedInputs(){
  SHEETS.forEach((s,i)=>{ const p=parseCSV(s.data);
    addSheet({id:'in'+i, cls:'input', name:s.name, label:p.rows.length+' rows — yours, untouched', cols:p.cols, rows:p.rows}); });
  ACTIVE=BOOK.length?BOOK[0].id:null; paint();
}
function appendView(v){
  VIEWS.push(v); J=J||{}; J.views=VIEWS; if(v.sql&&!J.sql)J.sql=v.sql;
  STATUS=oplabel(v.op)+'…';
  addSheet({id:'v'+VIEWS.length, cls:'deriv', name:v.name||('step_'+VIEWS.length), label:v.label||oplabel(v.op), cols:v.columns||[], rows:v.rows||[], sql:v.sql||''});
}
function appendResolve(r){
  RESOLVES.push(r);
  STATUS='Resolving '+(r.column||'')+'…';
  if(!r.unconnected&&r.columns)
    addSheet({id:'r'+RESOLVES.length, cls:'ref', name:(r.wtable||'world')+' (wikipedia)', label:'resolved "'+(r.column||'')+'" against this reference', cols:r.columns||[], rows:r.rows||[]});
  else paint();
}
function markDone(){ if(SETTLED)return; DONE=true; clearTimeout(doneTimer); doneTimer=setTimeout(finalize,400); }
function finalize(){
  if(SETTLED)return; settle();
  if(!VIEWS.length){                                          // delegated (no composition) — synthesize the single result sheet
    const r=(J&&J.result)||{};
    appendView({name:'result',op:'group_agg',label:'result',sql:(J&&J.sql)||'',columns:r.columns||[],rows:r.rows||[]});
  } else if(J&&J.result&&J.result.rows){                      // the last view's table is the authoritative final answer
    const lv=VIEWS[VIEWS.length-1], lm=BOOK.filter(s=>s.cls==='deriv').pop();
    lv.columns=J.result.columns||lv.columns; lv.rows=J.result.rows||lv.rows;
    if(lm){ lm.cols=lv.columns; lm.rows=lv.rows; }
  }
  const last=BOOK.filter(s=>s.cls==='deriv').pop();
  if(last){ last.result=true; if(AUTO) ACTIVE=last.id; }
  const n=BOOK.filter(s=>s.cls==='deriv').length;
  STATUS='Answered in '+n+' step'+(n===1?'':'s');
  paint();
}
function renderFromJSON(j){
  if(SETTLED)return;
  if(j.clarify){ goClarify(Object.assign({question:question},j)); return; }
  if(j.error){ fail(j.error); settle(); return; }
  J=j; (j.views||[]).forEach(v=>appendView(v));
  DONE=true; finalize();
}
function settle(){ SETTLED=true; clearTimeout(doneTimer); if(UNSUB){try{UNSUB();}catch(_){}UNSUB=null;} }
function goClarify(c){ settle(); try{ sessionStorage.setItem(SS.CLARIFY,JSON.stringify(c)); }catch(_){}; location.href='clarify'; }

async function run(){
  seedInputs();
  let token;
  try{ token=await window.ensureToken(); }
  catch(e){ fail('sign-in required to run on your data: '+(e&&e.message||e)); return; }
  const uid=window.__uid;
  const jobId=(crypto&&crypto.randomUUID)?crypto.randomUUID():(Date.now()+'-'+Math.random().toString(36).slice(2));
  // (1) kick off the job FIRE-AND-FORGET: on the streaming path the answer arrives via RTDB, not this
  // response. Keep the parsed-body promise so both fallbacks can await it (body reads exactly once).
  const parseBody=async r=>{ try{ if(!r)return null; const txt=await r.text(); return (r.ok&&txt.trim().charAt(0)==='{')?JSON.parse(txt):null; }catch(_){ return null; } };
  const httpPromise=fetch(ENDPOINT,{method:'POST',headers:{'content-type':'application/json','Authorization':'Bearer '+token},
                                    body:JSON.stringify({tables:SHEETS,question:question,jobId:jobId})}).then(parseBody).catch(()=>null);
  // (2) live trace -> sheets appear as the engine works.
  if(uid&&window.subscribeRun){
    UNSUB=window.subscribeRun(uid,jobId,{
      onStatus:st=>{ if(SETTLED)return;
        if(st==='resolving'&&!VIEWS.length&&!RESOLVES.length){ STATUS='Resolving to the world…'; renderRail(); }
        else if(st==='running'&&!VIEWS.length&&!RESOLVES.length){ STATUS='Decomposing into steps…'; renderRail(); }
        else if(st==='done') markDone(); },
      onResolve:(k,r)=>{ if(SETTLED||!r||typeof r!=='object'||!r.column||SEEN_R.has(k))return; SEEN_R.add(k); appendResolve(r); if(DONE)markDone(); },
      onView:(k,v)=>{ if(SETTLED||!v||SEEN.has(k))return; SEEN.add(k); appendView(v); if(DONE)markDone(); },
      onResult:r=>{ if(SETTLED)return; J=J||{}; J.result=r; if(DONE)markDone(); },
      onClarify:c=>{ if(SETTLED)return; goClarify(Object.assign({question:question},c)); },
      onError:e=>{ if(SETTLED)return; fail(e||'the model reported an error'); settle(); },
    });
  }
  // (2b) EARLY FALLBACK: the POST body only arrives when the job is COMPLETE — if it lands and the
  // stream has shown no life shortly after, streaming is unavailable; render the JSON now.
  httpPromise.then(async j=>{
    if(!j||SETTLED||DONE)return;
    await new Promise(res=>setTimeout(res,3000));             // grace: a merely-lagging stream still wins
    if(SETTLED||DONE||VIEWS.length||RESOLVES.length)return;
    renderFromJSON(j);
  });
  // (3) SAFETY NET: if RTDB never reports within ~90s, await/re-drive the POST (cold-start retries).
  setTimeout(async()=>{
    if(SETTLED||DONE||VIEWS.length)return;
    let j=null;
    for(let a=0;a<5&&!j&&!SETTLED&&!DONE;a++){
      try{
        j=a===0?await httpPromise:await fetch(ENDPOINT,{method:'POST',headers:{'content-type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({tables:SHEETS,question:question,jobId:jobId})}).then(parseBody);
        if(j)break;
      }catch(_){}
      if(a<4){ STATUS='Warming up the model (cold start)…'; renderRail(); await new Promise(res=>setTimeout(res,4000)); }
    }
    if(SETTLED||DONE||VIEWS.length)return;
    if(!j){ fail('the model is taking too long to start — please try again in a moment'); return; }
    renderFromJSON(j);
  },90000);
}
try{ fetch(ENDPOINT,{method:'GET',cache:'no-store'}).catch(()=>{}); }catch(_){}   // pre-warm the scale-to-zero backend
</script>
