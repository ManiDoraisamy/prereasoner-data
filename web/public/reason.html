<!doctype html><html lang=en><head>
<meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Prereasoner · workbook</title>
<link rel=preconnect href="https://fonts.googleapis.com"><link rel=preconnect href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel=stylesheet>
<link rel=stylesheet href="/styles.css?v=15">
</head><body class=app>
<!-- The read-only WORKBOOK (shared logic: lib/workbook.js; shared styles: styles.css).
     Green sheets = the user's tables (the AI never writes here). Blue sheets = one per
     reasoning step. Grey sheets = the reference lookups it used. -->
<div class=screen>
  <div class=hdr>
    <button class=menubtn id=menubtn aria-label="Conversations" aria-controls=drawer aria-expanded=false onclick=openDrawer()><svg viewBox="0 0 24 24" width=20 height=20 aria-hidden=true><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width=2 stroke-linecap=round fill=none/></svg></button>
    <div class=htitle id=htitle title=""></div>
    <div class=spacer></div>
    <div class=accountwrap id=accountwrap hidden><button class=accountbtn type=button id=accountbtn aria-label="Account" aria-haspopup=menu aria-expanded=false></button>
      <div class=accountmenu id=accountmenu role=menu><div class=accountidentity id=accountidentity></div><a href="/support" role=menuitem>Support</a><a href="/privacy" role=menuitem>Privacy</a><a href="/terms" role=menuitem>Terms</a><button type=button id=signoutbtn role=menuitem>Sign out</button></div>
    </div>
  </div>
  <div class=drawer-backdrop id=drawerback onclick=closeDrawer()></div>
  <aside class=drawer id=drawer aria-label="Conversations" aria-hidden=true inert>
    <div class=drawerhd><span>Chats</span><button class=drawerx onclick=closeDrawer() aria-label="Close chats">&times;</button></div>
    <div class=railtop><button class=convnew onclick="newConversation()">New chat</button></div>
    <div class=convlist id=convlist></div>
    <div class=railuser id=draweruser hidden></div>
  </aside>
  <div class=workmain>
    <div class=sheetside>
      <div class=sheetcard id=sheetcard>
        <div class=sheetmsg id=sheetmsg><span class=spin></span> Loading your data…</div>
      </div>
      <div class=tabsbar>
        <button class=tabarrow id=tabL onclick=scrollTabs(-1) aria-label="Previous sheets" disabled>&#8249;</button>
        <button class=tabarrow id=tabR onclick=scrollTabs(1) aria-label="Next sheets" disabled>&#8250;</button>
        <div class=tabscroll id=tabstrip></div>
      </div>
    </div>
    <div class=rail>
      <div class=railhead><span class=inputcount id=inputcount>0 sheets</span><button class=syncstate id=syncstate type=button hidden></button></div>
      <div class=railscroll id=rail></div>
      <div class=chatbar>
        <textarea id=chatq rows=1 placeholder="Ask a follow-up…"></textarea>
        <button id=chatsend class=sendbtn aria-label=Send disabled>&#8593;</button>
      </div>
    </div>
  </div>
</div>
<script src="/lib/shared.js"></script>
<script src="/lib/result-wire.js"></script>
<script>
window.WB_CONFIG = { endpoint: '/api/reason' };   // reason: composition over the uploaded sheets (+world joins)
</script>
<script src="/lib/workbook-reference.js"></script>
<script src="/lib/workbook-conversations.js"></script>
<script src="/lib/workbook.js"></script>
<script type="module">
// ensureSignedIn resolves the uid, resolves null when redirecting to Google, and THROWS when a
// redirect came back without a session (the loop-breaker) — show that instead of looping.
import { auth, ensureSignedIn, signOutUser } from "/lib/firebase-init.js";
function showAccount(user){
  if(!user)return;const wrap=document.getElementById('accountwrap'),btn=document.getElementById('accountbtn'),menu=document.getElementById('accountmenu');
  const name=(user.displayName||'').trim()||(user.email||'').trim()||'Account';wrap.hidden=false;btn.textContent=name.slice(0,1).toUpperCase();
  const identity=document.getElementById('accountidentity');identity.textContent='';const strong=document.createElement('strong');strong.textContent=name;
  const email=document.createElement('span');email.textContent=user.email||'';identity.append(strong,email);
  btn.onclick=event=>{event.stopPropagation();const open=menu.classList.toggle('open');btn.setAttribute('aria-expanded',open?'true':'false');};
  document.addEventListener('click',()=>{menu.classList.remove('open');btn.setAttribute('aria-expanded','false');});
  document.addEventListener('keydown',event=>{if(event.key==='Escape'){menu.classList.remove('open');btn.setAttribute('aria-expanded','false');}});
  document.getElementById('signoutbtn').onclick=async()=>{await signOutUser();location.href='/';};
  const drawerUser=document.getElementById('draweruser');drawerUser.textContent='';
  const avatar=document.createElement('span');avatar.className='railav';avatar.textContent=name.slice(0,1).toUpperCase();
  const who=document.createElement('span');who.className='railwho';who.textContent=name;who.title=user.email||name;
  drawerUser.append(avatar,who);drawerUser.hidden=false;
}
try { if (await ensureSignedIn()){ showAccount(auth.currentUser); run(); } }
catch (e) { fail((e && e.message) || 'Google sign-in did not complete — please try again.'); }
</script></body></html>
