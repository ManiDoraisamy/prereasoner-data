<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 440 560" role="img" aria-label="Two research papers: Anthropic and Prereasoner">
  <style><![CDATA[
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@600&display=swap');
    .ttl{font-family:Inter,system-ui,sans-serif;font-weight:700;fill:#1e1340}
    .by{font-family:Inter,system-ui,sans-serif;font-weight:600;font-size:13.5px}
    .pdf{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;letter-spacing:1.5px}
    .read{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600}
    a{cursor:pointer}
  ]]></style>
  <defs>
    <clipPath id="vp"><rect x="0" y="0" width="440" height="516"/></clipPath>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#241066" flood-opacity="0.30"/>
    </filter>
  </defs>

  <g clip-path="url(#vp)">
    <g>
      <animateTransform attributeName="transform" attributeType="XML" type="translate"
        dur="11s" repeatCount="indefinite" calcMode="spline"
        keyTimes="0;0.40;0.50;0.90;1" values="0 0;0 0;-440 0;-440 0;0 0"
        keySplines="0 0 1 1;.65 0 .35 1;0 0 1 1;.65 0 .35 1"/>

      <!-- PAPER A — Anthropic -->
      <a href="https://www.anthropic.com/research/reasoning-models-dont-say-think" target="_blank"
         xlink:href="https://www.anthropic.com/research/reasoning-models-dont-say-think">
        <rect x="52" y="40" width="336" height="452" rx="13" fill="#fff" filter="url(#sh)"/>
        <path d="M52 53 a13 13 0 0 1 13 -13 h310 a13 13 0 0 1 13 13 v4 H52 Z" fill="#c2410c"/>
        <rect x="76" y="72" width="120" height="22" rx="11" fill="#fbe7df"/>
        <text x="136" y="87" text-anchor="middle" class="pdf" fill="#c2410c">THE PROBLEM</text>
        <text class="ttl" font-size="23"><tspan x="76" y="150">Reasoning models</tspan><tspan x="76" y="181">don't always say</tspan><tspan x="76" y="212">what they think</tspan></text>
        <text x="76" y="246" class="by" fill="#c2410c">Anthropic</text>
        <g fill="#ece9f5"><rect x="76" y="276" width="288" height="6" rx="3"/><rect x="76" y="294" width="288" height="6" rx="3"/><rect x="76" y="312" width="244" height="6" rx="3"/><rect x="76" y="330" width="280" height="6" rx="3"/><rect x="76" y="348" width="172" height="6" rx="3"/></g>
        <text x="76" y="466" class="read" fill="#c2410c">Read the paper &#8594;</text>
      </a>

      <!-- PAPER B — Prereasoner -->
      <a href="https://manidoraisamy.com/ai-interpretable.html" target="_blank"
         xlink:href="https://manidoraisamy.com/ai-interpretable.html" transform="translate(440,0)">
        <rect x="52" y="40" width="336" height="452" rx="13" fill="#fff" filter="url(#sh)"/>
        <path d="M52 53 a13 13 0 0 1 13 -13 h310 a13 13 0 0 1 13 13 v4 H52 Z" fill="#3f1aca"/>
        <rect x="76" y="72" width="120" height="22" rx="11" fill="#ece8fb"/>
        <text x="136" y="87" text-anchor="middle" class="pdf" fill="#3f1aca">OUR ANSWER</text>
        <text class="ttl" font-size="21.5"><tspan x="76" y="148">AI that makes</tspan><tspan x="76" y="177">life-or-death decisions</tspan><tspan x="76" y="206">should be interpretable</tspan></text>
        <text x="76" y="240" class="by" fill="#3f1aca">Prereasoner</text>
        <g fill="#ece9f5"><rect x="76" y="270" width="288" height="6" rx="3"/><rect x="76" y="288" width="288" height="6" rx="3"/><rect x="76" y="306" width="244" height="6" rx="3"/><rect x="76" y="324" width="280" height="6" rx="3"/><rect x="76" y="342" width="196" height="6" rx="3"/></g>
        <text x="76" y="466" class="read" fill="#3f1aca">Read the blog &#8594;</text>
      </a>
    </g>
  </g>

  <!-- slide indicator -->
  <circle cx="210" cy="536" r="5" fill="#fff">
    <animate attributeName="opacity" dur="11s" repeatCount="indefinite" keyTimes="0;0.40;0.50;0.90;1" values="1;1;0.35;0.35;1"/>
  </circle>
  <circle cx="230" cy="536" r="5" fill="#fff">
    <animate attributeName="opacity" dur="11s" repeatCount="indefinite" keyTimes="0;0.40;0.50;0.90;1" values="0.35;0.35;1;1;0.35"/>
  </circle>
</svg>
