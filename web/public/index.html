/* "More examples" badge + the example-question picker (reuses the preview modal chrome) */
/* the formfacade.com "More >" affordance: a plain text link with a chevron — Inter 14/400, no
   border, no padding, no uppercase. Formfacade paints it brand purple on white; the same purple on
   this purple backdrop would vanish, so only the colour carries over to white. */

.morex:hover{text-decoration:underline}

<script src="lib/xlsx-reader.js"></script>
<script>
// Demo workbooks live in /dataset/<name>/ as plain CSVs plus a prompt.txt that prefills the
// question, selected by ?load=. The default is the single denormalized orders sheet (with each
// customer's city and tier). orders-tiers is the separate joined discount-schedule fixture.
// customers-orders is the two-sheet FK-join variant; payment-commissions exercises a separate joined rate calculation.
// FX comes from the knowledgebase (ECB), never from a demo sheet.
const DATASETS={'customer-orders':['orders'],'orders-tiers':['orders','tier'],'customers-orders':['customers','orders'],
  'complex-promotions':['customers','products','orders','order_items'],
  'complex-category-gaps':['customers','products','purchases'],
  'complex-unsold-products':['products','purchases'],
  'neartail-orders-xlsx':['orders.xlsx'],
  'complex-promotions-xlsx':['customers.xlsx','products.xlsx','orders.xlsx','order_items.xlsx'],
  'formfacade-leads':['responses'],'neartail-orders':['orders'],'formesign-intake':['intake'],
  'formfacade-workshops':['feedback'],'neartail-shipping':['deliveries'],'formesign-contracts':['contracts'],
  'formesign-hospital-transfers':['transfers'],'neartail-catering':['catering'],'formfacade-bank-deposits':['deposits'],
  'payment-commissions':['payments','commission_rates']};
const DATASET=(p=>Object.prototype.hasOwnProperty.call(DATASETS,p)?p:'customer-orders')(
  new URLSearchParams(location.search).get('load'));
const $=id=>document.getElementById(id);
const Q0=$('q').value;                                     // the HTML fallback question, captured before any restore
let SHEETS=[], isSample=true;                              // first real upload replaces the demo
let UPLOAD_PENDING=false, UPLOAD_ERROR='', UPLOAD_BATCH=0;
const DEMO_LOAD=Promise.all([
  Promise.all(DATASETS[DATASET].map(n=>{
    // A registry entry ending in .xlsx ships as a real workbook and converts to CSV text
    // through the SAME bounded worker the upload path uses, so everything downstream
    // (chips, sessionStorage, /reason) still sees one CSV per table.
    const xlsx=n.endsWith('.xlsx'), base=xlsx?n.slice(0,-5):n;
    return fetch('/dataset/'+DATASET+'/'+(xlsx?n:n+'.csv')).then(r=>{
      if(!r.ok)throw new Error(base+': HTTP '+r.status);
      return xlsx
        ? r.blob().then(b=>XLSX_READER.readWorkbook(b)).then(sheets=>{
            if(!sheets.length)throw new Error(base+': no sheet has a header and a data row');
            return sheets.map(s=>({name:sheets.length>1?s.name:base, data:s.csv.replace(/\r\n/g,'\n').trim()}));
          })
        : r.text().then(t=>[{name:base, data:t.replace(/\r\n/g,'\n').trim()}]);
    });
  })),
  fetch('/dataset/'+DATASET+'/prompt.txt').then(r=>r.ok?r.text():'').catch(()=>''),
]).then(([t,p])=>{
  if(isSample){ SHEETS=t.flat(); renderChips(); }          // an upload or picker return that landed first wins
  p=p.trim();                                              // the dataset's prompt fills a PRISTINE box only — never
  if(p&&$('q').value===Q0)$('q').value=p;                  // a question the user typed or a picker round-trip restored
}).catch(e=>{ if(isSample)$('err').textContent='The demo data did not load ('+(e&&e.message||e)+'). Attach your own file, or reload.'; });
function renderChips(){
  $('chips').innerHTML=SHEETS.map((s,i)=>'<span class=chip data-i="'+i+'" title="'+esc(s.filename||s.name)+'"><span class=ic>📄</span><span class=nm>'+esc(s.name)+'</span><small> '+parseCSV(s.data).rows.length.toLocaleString()+' rows</small></span>').join('');
  [...$('chips').querySelectorAll('.chip')].forEach(el=>el.onclick=()=>openPreview(+el.dataset.i));
}
function openPreview(i){
  const s=SHEETS[i], p=parseCSV(s.data);
  $('ph').innerHTML=esc(s.name)+' <span class=c>· '+p.rows.length+' rows × '+p.cols.length+' cols'
    +(s.import?' · imported from header row '+s.import.headerRow
      +(s.import.source==='google-sheets'?' (Google Sheets snapshot)':' (cached Excel values)'):'')
    +(p.rows.length>500?' · previewing first 500':'')+'</span>';
  let h='<table class=ptab><tr><th class=rn></th>'+p.cols.map(c=>'<th>'+esc(c.trim())+'</th>').join('')+'</tr>';
  p.rows.slice(0,500).forEach((r,ri)=>{h+='<tr><td class=rn>'+(ri+1)+'</td>'+p.cols.map((c,ci)=>'<td>'+esc(r[ci]==null?'':r[ci])+'</td>').join('')+'</tr>';});
  $('ptabwrap').innerHTML=h+'</table>';
  $('preview').style.display='block'; $('pbackdrop').style.display='block';
}
function closePreview(){$('preview').style.display='none'; $('pbackdrop').style.display='none';}
/* "More examples": every /dataset/<dir>/ ships a prompt.txt; the picker lists them and a click loads
   that dataset + prompt via the same ?load= URL the shareable dataset.txt index uses. */
let EXAMPLES=null;
async function openExamples(){
  $('examples').style.display='block'; $('exbackdrop').style.display='block';
  if(EXAMPLES)return;
  // Built from DATASETS — the SAME map ?load= resolves against — so every row listed is one that really
  // loads, and each row names the sheets it attaches, not its directory path. The names are printed
  // VERBATIM so a row reads exactly like the chips it produces; no ".csv" is appended, because a chip
  // is a SHEET name (an uploaded .xlsx contributes one chip per worksheet and has no file extension).
  EXAMPLES=(await Promise.all(Object.keys(DATASETS).map(d=>
    fetch('/dataset/'+d+'/prompt.txt').then(r=>r.ok?r.text():'').catch(()=>'')
      .then(p=>({dir:d, files:DATASETS[d].map(baseName).join(', '), prompt:p.trim()}))
  ))).filter(e=>e.prompt);
  $('exlist').innerHTML=EXAMPLES.length
    ? EXAMPLES.map(e=>'<button type=button data-load="'+esc(e.dir)+'"><div class=xq>'+esc(e.prompt)+'</div><div class=xd>'+esc(e.files)+'</div></button>').join('')
    : '<div class=xempty>The examples did not load — please try again.</div>';
  if(!EXAMPLES.length)EXAMPLES=null;                                              // a failed fetch retries on the next open
  [...$('exlist').querySelectorAll('button')].forEach(b=>b.onclick=()=>{location.href='/'+executionQuery('?load='+encodeURIComponent(b.dataset.load));});
}
function closeExamples(){$('examples').style.display='none'; $('exbackdrop').style.display='none';}
$('morex').addEventListener('click',openExamples);
try{                                                       // returning from /picker: attach the imported Google Sheet + restore the prompt
  const pend=sessionStorage.getItem(SS.PENDING_SHEETS);
  if(pend){ const t=JSON.parse(pend); if(t&&t.length){ SHEETS=t; isSample=false; } sessionStorage.removeItem(SS.PENDING_SHEETS); }
  const pq=sessionStorage.getItem(SS.PENDING_Q);
  if(pq!=null){ $('q').value=pq; sessionStorage.removeItem(SS.PENDING_Q); }
}catch(_){}
renderChips();
function baseName(n){return (n||'').replace(/\.(csv|tsv|txt|xlsx|xlsm|xls)$/i,'');}
function addSheet(name,data){if(isSample){SHEETS=[];isSample=false;}SHEETS.push({name:name,data:data});}
$('file').addEventListener('change',async function(e){     // CSV/TSV read as text; .xlsx/.xls parsed client-side -> ONE table per worksheet (FK-joinable like multi-CSV)
  const files=[...e.target.files]; if(!files.length)return;
  const batch=++UPLOAD_BATCH, pending=[];
  UPLOAD_PENDING=true; UPLOAD_ERROR='';
  const ask=document.querySelector('#f button[type=submit]'); ask.disabled=true;
  $('err').textContent='';
  try{
    for(const f of files){
      if(/\.(xlsx|xlsm|xls)$/i.test(f.name)){
        const used=await XLSX_READER.readWorkbook(f);
        if(!used.length)throw new Error('“'+f.name+'” has no sheet with a header and a data row.');
        used.forEach(x=>pending.push({name:used.length>1?x.name:baseName(f.name),data:x.csv,filename:f.name,import:x.import}));
      }else{
        const data=await XLSX_READER.readText(f);
        if(!parseCSV(data).rows.length)throw new Error('“'+f.name+'” has no data rows.');
        pending.push({name:baseName(f.name),data,filename:f.name});
      }
    }
    if(batch!==UPLOAD_BATCH)return;
    const next=(isSample?[]:SHEETS).concat(pending);
    if(next.length>UPLOAD_LIMITS.sheets)throw new Error('Attach at most 8 tables.');
    if(next.reduce((n,s)=>n+s.data.length,0)>UPLOAD_LIMITS.totalChars)throw new Error('The combined tables are too large.');
    SHEETS=next; isSample=false; renderChips();
  }catch(err){
    if(batch!==UPLOAD_BATCH)return;
    UPLOAD_ERROR='Upload failed: '+((err&&err.message)||err)+' Choose files again to continue.';
    $('err').textContent=UPLOAD_ERROR;
  }finally{
    if(batch===UPLOAD_BATCH){UPLOAD_PENDING=false;ask.disabled=!!UPLOAD_ERROR;e.target.value='';}
  }
});
$('q').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('f').requestSubmit();}});  // Enter sends, Shift+Enter newline
$('f').addEventListener('submit',async function(e){
  e.preventDefault();
  if(UPLOAD_PENDING||UPLOAD_ERROR){$('err').textContent=UPLOAD_ERROR||'Wait for the upload to finish.';return;}
  const q=$('q').value.trim();
  if(isSample){ try{ await DEMO_LOAD; }catch(_){} }        // a fast Ask must not race the demo fetch
  if(UPLOAD_PENDING||UPLOAD_ERROR)return;
  const valid=SHEETS.filter(s=>s.data.trim().split(/\r?\n/).filter(Boolean).length>=2);
  if(!valid.length){$('err').textContent='Attach at least one CSV or Excel file with a header row and a data row.';return;}
  if(!q){$('err').textContent='Type a question about your table.';return;}
  try{                          // ALL sheets -> /reason (view-stacking composition; delegates plain/world queries to the world path)
    sessionStorage.setItem(SS.TABLES,JSON.stringify(valid));
    sessionStorage.setItem(SS.CSV,valid[0].data); sessionStorage.setItem(SS.NAME,valid[0].name);
    sessionStorage.setItem(SS.Q,q);
    // A query from home starts a NEW conversation: clear ALL conversation-scoped state, exactly like
    // newConversation() does. Leaving pr_orch_history behind leaked every prior conversation's transcript
    // into the new one's /chat body until it crossed the server's history cap -> 413 on every submit.
    ['pr_conversation_id','pr_orch_history','pr_conv_state'].forEach(k=>sessionStorage.removeItem(k));
  }catch(_){}
  location.href='reason'+executionQuery();                                         // auth happens ON /reason (redirect there) — no home bounce
});
// Data-source entry: the button is a bare "+" everywhere. On "/" it opens the source menu
// (Google Sheets / Excel / CSV); on the /sheets, /excel and /csv single-source landings it
// triggers that source directly, no menu. One addSource() owns every path.
function addSource(kind){
  if(kind==='sheets'){
    try{ sessionStorage.setItem(SS.PENDING_Q,$('q').value);              // preserve the typed prompt across the picker round-trip
         sessionStorage.setItem(SS.RETURN_TO,location.pathname+executionQuery(location.search)); }catch(_){}
    location.href='picker'+executionQuery();                  // pick a Google Sheet -> returns here with it attached as a chip
  } else {
    $('file').setAttribute('accept', kind==='excel'
      ? '.xlsx,.xlsm,.xls,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
      : '.csv,.tsv,.txt,text/csv,text/plain');
    $('file').click();
  }
}
// Single-source landings, keyed by ROUTE slug. The Google Picker lives at /picker (its path is
// irrelevant to Google — the browser API key is restricted by ORIGIN, not path), so /sheets is
// free to be the landing and stay consistent with /excel and /csv.
const MODE_CFG={
  sheets:{src:'sheets', lbl:'Add a Google Sheet', h1:'Attach a Google Sheet and ask a question',
         ph:'What question do you have about this Sheet?'},
  excel:{src:'excel',  lbl:'Add an Excel file',  h1:'Attach an Excel sheet and ask a question',
         ph:'What question do you have about this Excel sheet?'},
  csv:  {src:'csv',    lbl:'Add a CSV file',     h1:'Attach a CSV file and ask a question',
         ph:'What question do you have about this CSV?'}
};
const MODE=(function(){const p=location.pathname.replace(/\/+$/,'').slice(1).toLowerCase();
  return Object.prototype.hasOwnProperty.call(MODE_CFG,p)?p:'';})();
const addbtn=$('addbtn'), addmenu=$('addmenu');
if(MODE){
  const cfg=MODE_CFG[MODE];
  $('hd').textContent=cfg.h1;
  $('q').setAttribute('placeholder',cfg.ph);
  addbtn.setAttribute('aria-label',cfg.lbl); addbtn.setAttribute('title',cfg.lbl);
  addbtn.removeAttribute('aria-haspopup'); addbtn.removeAttribute('aria-expanded');
  addbtn.onclick=function(){addSource(cfg.src);};
}else{
  addbtn.onclick=function(e){e.stopPropagation();const o=addmenu.classList.toggle('open');addbtn.setAttribute('aria-expanded',o);};
  document.addEventListener('click',function(){addmenu.classList.remove('open');});
  addmenu.onclick=function(e){e.stopPropagation();};
  [...addmenu.querySelectorAll('button')].forEach(b=>b.onclick=function(){
    addmenu.classList.remove('open');
    addSource(b.dataset.add);
  });
}
try{ fetch(API_BASE+'/api/reason',{method:'GET',cache:'no-store'}).catch(()=>{}); }catch(_){}   // home -> /reason: pre-warm that backend
</script>
<script type="module">
import { auth, ensureSignedIn } from '/lib/firebase-init.js';
const login=document.getElementById('loginbtn');
const homeMenu=document.getElementById('homemenubtn'), homeBack=document.getElementById('homeback');
const homeRail=document.getElementById('homerail'), homeMedia=window.matchMedia('(max-width: 900px)');
function setHomeDrawer(open){
  open=!!open&&homeMedia.matches;
  document.body.classList.toggle('homeopen',open);
  homeBack.classList.toggle('open',open); homeBack.setAttribute('aria-hidden',open?'false':'true');
  homeMenu.setAttribute('aria-expanded',open?'true':'false');
  const concealed=homeMedia.matches&&!open; homeRail.inert=concealed;
  homeRail.setAttribute('aria-hidden',concealed?'true':'false');
  if(open){ try{ renderDrawer(); }catch(_){} }
}
homeMenu.addEventListener('click',()=>setHomeDrawer(!document.body.classList.contains('homeopen')));
homeBack.addEventListener('click',()=>setHomeDrawer(false));
document.addEventListener('keydown',event=>{ if(event.key==='Escape')setHomeDrawer(false); });
homeMedia.addEventListener('change',()=>setHomeDrawer(false));
// Signed in: the rail IS the signed-in state, so the badge is redundant — drop it and show
// the user's conversations instead. Rendering reuses the /reason drawer's list.
function showSignedIn(user){
  login.hidden=true;
  const rail=document.getElementById('homerail'); if(!rail) return;
  rail.hidden=false; homeMenu.hidden=false; document.body.classList.add('hasrail'); setHomeDrawer(false);
  document.getElementById('railnew').onclick=()=>{ try{ newConversation(); }catch(_){ location.href='/'; } };
  try{ bindConversationList(); renderDrawer(); }catch(_){}
  // The rail foots with WHO is signed in. Built with the DOM API, never interpolated
  // markup: the display name and email come from the identity provider.
  const box=document.getElementById('railuser'); if(!box||!user) return;
  const name=(user.displayName||'').trim()||(user.email||'').trim(); if(!name) return;
  box.textContent='';
  const av=document.createElement('span'); av.className='railav';
  av.textContent=name.slice(0,1).toUpperCase();
  const who=document.createElement('span'); who.className='railwho';
  who.textContent=name; who.title=(user.email||name);
  box.append(av,who); box.hidden=false;
}
try{await auth.authStateReady();if(auth.currentUser)showSignedIn(auth.currentUser);}catch(_){}
login.addEventListener('click',async()=>{
  login.disabled=true;login.textContent='Signing in…';
  try{if(await ensureSignedIn())showSignedIn(auth.currentUser);else{login.disabled=false;login.textContent='Login';}}
  catch(error){login.disabled=false;login.textContent='Login';document.getElementById('err').textContent=(error&&error.message)||'Sign-in failed. Please try again.';}
});
</script></body></html>
