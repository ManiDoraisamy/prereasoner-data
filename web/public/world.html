<!doctype html><html lang=en><head>
<meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Prereasoner · world knowledge</title>
<link rel=preconnect href="https://fonts.googleapis.com"><link rel=preconnect href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel=stylesheet>
<link rel=stylesheet href="styles.css?v=11">
</head><body class=app>
<!-- The read-only WORKBOOK on the /api/world path (unified-encoder world joins / hybrid
     semantic SQL). Same shell as /reason: shared logic in lib/workbook.js, styles in styles.css. -->
<div class=screen>
  <div class=hdr><a class=brand href="/"><img class=logo src="login_logo.svg" alt=""><span>Prereasoner</span></a><div class=spacer></div>
    <a class=ghost href="/" style="text-decoration:none">+ New</a></div>
  <div class=workmain>
    <div class=sheetside>
      <div class=sheetcard id=sheetcard>
        <div class=sheetmsg id=sheetmsg><span class=spin></span> Loading your data…</div>
      </div>
      <div class=tabsbar>
        <button class=tabarrow id=tabL onclick=scrollTabs(-1) aria-label="Previous sheets" disabled>&#8249;</button>
        <button class=tabarrow id=tabR onclick=scrollTabs(1) aria-label="Next sheets" disabled>&#8250;</button>
        <div class=tabscroll id=tabstrip></div>
      </div>
    </div>
    <div class=rail>
      <div class=railscroll id=rail></div>
      <div class=chatbar>
        <textarea id=chatq rows=1 placeholder="Ask a follow-up…"></textarea>
        <button id=chatsend class=sendbtn aria-label=Send disabled>&#8593;</button>
      </div>
    </div>
  </div>
</div>
<script src="lib/shared.js"></script>
<script>
window.WB_CONFIG = {
  endpoint: '/api/world',                             // world path: resolution + world-knowledge joins
  runningMsg: 'Joining to world knowledge…',
  warmupMsg: 'Warming up the model (~1 min on first use)…',
  demoQ: 'which of these cities are in France?',
  demoTables: [{name:'cities.csv', data:'city,visitors\nParis,500\nBerlin,300\nMadrid,200\nLyon,150'}],
};
</script>
<script src="lib/workbook.js"></script>
<script type="module">
// ensureSignedIn resolves the uid, resolves null when redirecting to Google, and THROWS when a
// redirect came back without a session (the loop-breaker) — show that instead of looping.
import { ensureSignedIn } from "./lib/firebase-init.js";
try { if (await ensureSignedIn()) run(); }
catch (e) { fail((e && e.message) || 'Google sign-in did not complete — please try again.'); }
</script></body></html>
