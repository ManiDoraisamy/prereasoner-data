<!doctype html><html lang=en><head>
<meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Prereasoner · world knowledge</title>
<link rel=preconnect href="https://fonts.googleapis.com"><link rel=preconnect href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel=stylesheet>
<link rel=stylesheet href="styles.css?v=8">
<style>
.spin{display:inline-block;width:14px;height:14px;border:2.5px solid #d9d2f3;border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.gridcard{background:transparent;box-shadow:none;border-radius:0;overflow:visible;max-width:820px;width:min(820px,100%);padding:0;display:flex;flex-direction:column;gap:13px;align-self:center}
.bubble{background:#fff;border-radius:16px;box-shadow:0 14px 40px rgba(40,12,140,.22);padding:15px 20px}
.lbl{font:600 10px var(--mono);letter-spacing:.6px;text-transform:uppercase;color:var(--card-ink-dim);margin-bottom:9px}
.qbub{font-size:16px;color:var(--card-ink);font-weight:500;line-height:1.4}
.rtab{border-collapse:separate;border-spacing:0;font-size:13px;width:auto;min-width:100%}
.rtab th,.rtab td{border-bottom:1px solid #efeafa;border-right:1px solid #efeafa;padding:7px 11px;text-align:left;vertical-align:top;white-space:nowrap}
.rtab tr:last-child td{border-bottom:none}.rtab th:last-child,.rtab td:last-child{border-right:none}
.rtab th{background:#f3effd;color:var(--brand);font:600 12px var(--mono);cursor:default;position:relative}
.rtab td.n,.rtab th.n{text-align:right;font-variant-numeric:tabular-nums}
.rtab td{max-width:340px;overflow:hidden;text-overflow:ellipsis}   /* pathological cells truncate, not balloon */
.rtab .val{color:var(--card-ink);font-family:var(--mono)}
.rtab th.hl{background:#e7defc;color:#5b3fd6}.rtab td.hl{background:#f3effd;color:#4a2db5;font-weight:600}
/* wide sheets (many columns) scroll WITHIN the bubble instead of spilling onto the page */
.rtwrap{overflow-x:auto;overflow-y:visible;max-width:100%}
.rtwrap::-webkit-scrollbar{height:8px}
.rtwrap::-webkit-scrollbar-thumb{background:#d9d2f3;border-radius:6px}
.rtwrap::-webkit-scrollbar-track{background:transparent}
.dpop{display:none;position:absolute;top:calc(100% + 5px);left:0;z-index:40;background:#fff;box-shadow:0 12px 34px rgba(20,12,48,.30);border:1px solid #eee;border-radius:10px;padding:8px 9px;gap:5px;flex-wrap:wrap;width:max-content;max-width:300px}
.rtab th:hover .dpop{display:flex}
.sqltoks{display:flex;flex-wrap:wrap;gap:13px 15px;align-items:flex-start}
.tok{display:flex;flex-direction:column;gap:5px;position:relative}
.tok .tt{font:600 17px var(--mono);color:#cbc4e6;transition:color .3s;cursor:default}
.tok .tt.kw,.tok .tt.punc{color:#7c3aed}.tok .tt.id{color:#16a34a}.tok .tt.table{color:#0891b2}.tok .tt.world{color:#c026d3}.tok .tt.lit{color:#d6336c}.tok .tt.op{color:#6b7280}
.tok .dpop{top:calc(100% + 2px)}.tok:hover .dpop{display:flex}
.dtag{display:inline-flex;align-items:center;gap:3px;color:#fff;background:#888;border-radius:6px;padding:2px 8px;font:600 11px var(--mono);white-space:nowrap}
.think{display:flex;align-items:center;gap:9px;color:var(--ink-dim);font:600 13px var(--mono);padding:2px 6px}
.infobtn{all:unset;cursor:pointer;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px}.infobtn:hover{background:rgba(255,255,255,.32)}
.backdrop{display:none;position:fixed;inset:0;background:rgba(20,12,48,.45);z-index:40}
.infocard{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:41;background:#fff;border-radius:14px;padding:22px 24px;max-width:470px;width:90%;max-height:84vh;overflow:auto;box-shadow:0 20px 60px rgba(20,12,48,.3);font-size:13px;color:#333;line-height:1.55}
.infocard p{margin:6px 0 12px}.ih{font-weight:700;color:#1c1340;margin:14px 0 7px}.ih:first-of-type{margin-top:2px}
.prov{display:flex;flex-direction:column;gap:6px;margin:2px 0 4px}
.pchip{display:inline-flex;align-items:center;gap:6px;background:#f3effd;color:var(--brand);border-radius:8px;padding:5px 10px;font:600 11px var(--mono);align-self:flex-start}.pchip.warn{background:#fff4e6;color:#b45309}
.irow{margin:6px 0;display:flex;align-items:center;flex-wrap:wrap}.irow .fl{display:inline-block;width:74px;color:#666;font-weight:600;font-size:12px}
.tg{display:inline-block;color:#fff;border-radius:9999px;padding:2px 8px;font:600 10px var(--mono);margin:2px 3px 2px 0}
.ix{position:absolute;top:8px;right:14px;border:0;background:none;font-size:22px;color:#aaa;cursor:pointer;line-height:1}
.tabs{display:flex;gap:2px;border-bottom:1px solid #eee;margin:0 0 13px;padding-right:26px}
.tab{all:unset;cursor:pointer;padding:7px 12px;font:600 12px var(--mono);color:#a79fc6;border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--brand)}.tab.active{color:var(--brand);border-bottom-color:var(--brand)}
.tabpane{display:none}.tabpane.active{display:block}
.dbgstage{font:700 10px var(--mono);letter-spacing:.7px;color:var(--brand);margin:15px 0 7px}.dbgstage:first-child{margin-top:0}
.dbgstage span{font-weight:400;letter-spacing:0;color:#9a93b5}
.dbgarrow{color:#cbc4e6;font:700 13px var(--mono);margin:2px 0 2px 5px;line-height:1}
.dbgsub{font:700 12px var(--mono);color:#1c1340;margin:8px 0 5px}.dbgsub.world{color:#9c2bad}
.dbgline{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 4px}
.dbgitem{background:#f3effd;color:#4a3f7a;border-radius:6px;padding:2px 7px;font:600 11px var(--mono)}
.dbgitem.world{background:#fbeafc;color:#9c2bad}
.dbgfeat{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:3px 0;font:600 11px var(--mono);color:#4a3f7a}
.dbgnote2{font-size:11px;color:#9a93b5;margin:7px 0 0;font-style:italic}
.dbgplan{display:flex;align-items:baseline;gap:8px;margin:4px 0;flex-wrap:wrap}
.dbgslot{min-width:84px;font:700 11px var(--mono);color:#1c1340}
.dbgval{font:600 11px var(--mono);color:#4a2db5}
.dbgvia{font:600 10px var(--mono);border-radius:5px;padding:1px 6px;margin-left:auto;white-space:nowrap}
.dbgvia.mod{background:#fbeafc;color:#9c2bad}.dbgvia.rul{background:#eef0f3;color:#6b7280}
.dbgsql{display:flex;flex-wrap:wrap;gap:4px}
.dbgtok{background:#4a2db5;color:#fff;border-radius:6px;padding:2px 7px;font:600 11px var(--mono)}
.emptynote{color:#9a93b5;font-size:12.5px;padding:8px 2px}
</style>
</head><body>
<div class=screen>
  <div class=hdr><a class=brand href="/"><img class=logo src="login_logo.svg" alt=""><span>Prereasoner</span></a><div class=spacer></div>
    <a class=ghost href="/" style="text-decoration:none">+ New</a></div>
  <div class=stage><div class=badge id=badge></div></div>
  <div class=gridwrap><div class=gridcard id=gridcard></div></div>
  <div class=controls>
    <button class=playbtn id=play onclick=togglePlay() aria-label=Play></button>
    <button class=stepbtn onclick="step(-1)">&#9664;</button>
    <div class=scrub id=scrub onclick=scrubClick(event)><div class=track><div class=fill id=fill></div><div class=ticks id=ticks></div><div class=knob id=knob></div></div></div>
    <button class=stepbtn onclick="step(1)">&#9654;</button>
    <button class=infobtn id=infobtn title="What is this?" onclick=toggleInfo()>&#9432;</button>
  </div>
  <div class=backdrop id=backdrop onclick=closeInfo()></div>
  <div class=infocard id=infocard>
    <button class=ix onclick=closeInfo() aria-label=Close>&times;</button>
    <div class=tabs>
      <button class="tab active" id=tab-warn onclick="showTab('warn')">⚠ Warnings</button>
      <button class="tab" id=tab-info onclick="showTab('info')">&#9432; Info</button>
      <button class="tab" id=tab-debug onclick="showTab('debug')">&#9881; Debug</button>
    </div>
    <div class="tabpane active" id=pane-warn></div>
    <div class="tabpane" id=pane-info></div>
    <div class="tabpane" id=pane-debug></div>
  </div>
</div>
<script src="lib/shared.js"></script>
<script src="lib/table-render.js"></script>
<script>
const $=id=>document.getElementById(id);
$('play').innerHTML=PLAY;
const LABEL={is_str:['📄','text','#22a06b'],is_num:['🔢','number','#3b82f6'],num_frac:['➗','decimal','#6366f1'],is_time:['📅','date/time','#8b5cf6'],is_bool:['☑','boolean','#e0840a'],currency:['💲','currency','#16a34a']};
function dimLabel(d){if(LABEL[d])return LABEL[d];if(d.indexOf('nsmcat_')===0)return['✦',d.slice(7).replace(/_/g,' '),'#b45309'];if(d.indexOf('nsm_')===0)return['✦',d.slice(4).replace(/_/g,' '),'#7c3aed'];if(d.indexOf('ace_')===0)return['◆',d.slice(4).replace(/_/g,' '),'#c026d3'];return['•',d,'#888'];}
function dtags(ds){return (ds||[]).slice(0,6).map(d=>{const m=dimLabel(d);return '<span class=dtag style="background:'+m[2]+'">'+m[0]+' '+m[1]+'</span>';}).join('');}
function dimTh(dims){return dims?(c=>((dims[c]&&dims[c].length)?'<div class=dpop>'+dtags(dims[c])+'</div>':'')):null;}   // hover popup of a column's dimension tags (for tableBubble opts.thExtra)
function toggleInfo(){const o=$('infocard').style.display==='block';$('infocard').style.display=o?'none':'block';$('backdrop').style.display=o?'none':'block';}
function closeInfo(){$('infocard').style.display='none';$('backdrop').style.display='none';}
function getSheets(){
  try{const t=sessionStorage.getItem(SS.TABLES);if(t){const a=JSON.parse(t);if(a&&a.length)return a;}}catch(_){}
  try{const c=sessionStorage.getItem(SS.CSV);if(c)return [{name:(sessionStorage.getItem(SS.NAME)||'table.csv'),data:c}];}catch(_){}
  return [{name:'customers.csv',data:'customer_id,name,city,tier\n1,Ada,Paris,gold\n2,Lin,Lyon,silver\n3,Bo,Paris,gold\n4,Sam,Berlin,silver'},
          {name:'orders.csv',data:'order_id,customer_id,amount,status\n101,1,50,shipped\n102,1,30,shipped\n103,2,80,pending\n104,3,20,shipped\n105,3,90,shipped\n106,4,40,pending'}];
}
function getQ(){try{const q=sessionStorage.getItem(SS.Q);if(q)return q;}catch(_){}return 'total amount in France';}
const SHEETS=getSheets(), question=getQ();
const TABNAMES=SHEETS.map((s,i)=>slug(s.name,i));   // the SQL table names the server will use (for token colouring)

let J=null,INPUTS=[],TOKS=[],REVEAL=[],VIEWS=[],LAST=0,S=0,playTimer=null,READY=false;
// streaming state (RTDB): resolve slides + views/result arrive incrementally. RESOLVES = the per-column resolution
// slides (each = {table,column,wtable,columns,rows}), shown between Input and the view stack / SQL animation. AUTO =
// auto-advance to the newest step until the user touches the transport. SETTLED/DONE = terminal-state guards.
let RESOLVES=[],VIEW_MODE=false,AUTO=true,SETTLED=false,DONE=false,UNSUB=null,doneTimer=null;
const SEEN=new Set(), SEEN_R=new Set();
function fail(m){READY=false;stopPlay();$('badge').innerHTML='&#9888; '+esc(m);}
function qBubble(){return '<div class=bubble><div class=qbub>'+esc(question)+'</div></div>';}
function tokClass(tk){
  const u=tk.toUpperCase();
  if(/ IN THE WORLD"/.test(u)) return 'world';                   // any reference to a world-knowledge table
  if(/^'/.test(tk)) return 'lit';
  if(['SELECT','DISTINCT','SUM','COUNT','AVG','MIN','MAX','FROM','JOIN','ON','WHERE','AND','OR','GROUP','BY','ORDER','LIMIT','DESC','ASC','IS','NULL'].includes(u)) return 'kw';
  const m=tk.match(/^"([^"]+)"$/);
  if(m && TABNAMES.includes(m[1].toLowerCase())) return 'table';   // an uploaded sheet name
  if(tk.indexOf('"')>=0) return 'id';
  return 'op';
}
function sqlToksBubble(upTo){                                     // SQL forming: tokens resolve grey -> coloured; hover a field for its named dims
  const dm=(J&&J.dims)||{};
  const toks=TOKS.map((tk,i)=>{
    const cls=i<upTo?tokClass(tk):'';
    const q=(tk.match(/"([^"]+)"/g)||[]).map(s=>s.slice(1,-1));           // qualified "Table"."col" -> world dims; else bare col
    const key=(q.length>=2 && dm[q[0]+'.'+q[1]]) ? q[0]+'.'+q[1] : q.find(c=>dm[c]);
    return '<span class=tok><span class="tt'+(cls?' '+cls:'')+'">'+esc(tk)+'</span>'+(key?'<div class=dpop>'+dtags(dm[key])+'</div>':'')+'</span>';
  }).join('');
  return '<div class=bubble><div class=sqltoks>'+toks+'</div></div>';
}
function showTab(n){['warn','info','debug'].forEach(k=>{$('tab-'+k).classList.toggle('active',k===n);$('pane-'+k).classList.toggle('active',k===n);});}
function fillInfo(){
  // ── Warnings: ambiguity + stale-source (freshness) ──
  const ws=(J&&J.warnings)||[];
  $('pane-warn').innerHTML = ws.length
    ? '<div class=prov>'+ws.map(w=>'<span class="pchip warn">⚠ '+esc(w)+'</span>').join('')+'</div>'
    : '<div class=emptynote>No warnings — every value resolved to a single world row and all sources are fresh.</div>';
  // ── Info: provenance (join / source / as-of) + legend ──
  const p=(J&&J.provenance)||{}; const chips=[];
  if(J&&J.meaning_join) chips.push('<span class=pchip>🔗 '+esc(J.meaning_join)+'</span>');
  if(p.source) chips.push('<span class=pchip>📚 '+esc(p.source)+'</span>');
  if(J&&J.as_of) chips.push('<span class=pchip>🕓 as of '+esc(J.as_of)+'</span>');
  $('pane-info').innerHTML =
    '<div class=ih>Provenance</div><div class=prov>'+(chips.join('')||'<span class=pchip>—</span>')+'</div>'
    +'<div class=ih>Legend</div>'
    +'<div class=irow><span class=fl>data</span> <span class=tg style="background:#3b82f6">🔢 number</span> <span class=tg style="background:#22a06b">📄 text</span> <span class=tg style="background:#c026d3">◆ city</span></div>'
    +'<div class=irow><span class=fl>query</span> <span class=tg style="background:#0891b2">your table</span> <span class=tg style="background:#c026d3">world table</span> <span class=tg style="background:#d6336c">value</span></div>';
  // ── Debug: the faithful input → output flow, stage by stage ──
  const d=(J&&J.debug)||{};
  const dchips=(line,w)=>'<div class=dbgline>'+(line||[]).map(tk=>'<span class="dbgitem'+(w?' world':'')+'">'+esc(tk)+'</span>').join('')+'</div>';
  const tbl=(s,w)=>'<div class="dbgsub'+(w?' world':'')+'"># '+esc(s.name)+'</div>'+(s.lines||[]).map(l=>dchips(l,w)).join('');
  const stage=(t,sub)=>'<div class=dbgstage>'+t+(sub?' <span>· '+sub+'</span>':'')+'</div>';
  const arrow='<div class=dbgarrow>&#8595;</div>';
  let h=stage('INPUT','you provide; the model encodes the tables');
  (d.input||[]).forEach(s=>h+=tbl(s,false));
  h+='<div class=dbgsub># question</div>'+dchips(d.question,false);
  if((d.derived||[]).length){ h+=arrow+stage('DERIVED','fetched via the routing feature, then encoded'); (d.derived||[]).forEach(s=>h+=tbl(s,true)); }
  h+=arrow+stage('FEATURES','model, last layer');
  (d.features||[]).forEach(f=>h+='<div class=dbgfeat>'+esc(f.col)+' &rarr; '+dtags(f.dims)+'</div>');
  if(!d.encoded_question) h+='<div class=dbgnote2>the question is matched by string rules in this path — no model features on its tokens</div>';
  if((d.plan||[]).length){ h+=arrow+stage('PLAN','planner reads features + rules');
    (d.plan||[]).forEach(p=>h+='<div class=dbgplan><span class=dbgslot>'+esc(p.slot)+'</span><span class=dbgval>'+esc(p.value)+'</span><span class="dbgvia '+(p.kind==='model'?'mod':'rul')+'">'+esc(p.via)+'</span></div>'); }
  h+=arrow+stage('OUTPUT','template filled from the plan');
  h+='<div class=dbgsql>'+sqlTokens((J&&J.sql)||'').map(tk=>'<span class=dbgtok>'+esc(tk)+'</span>').join('')+'</div>';
  $('pane-debug').innerHTML=h;
}
function inputBubbles(withDims){return INPUTS.map(t=>tableBubble(t.cols,t.rows,t.name,{thExtra:withDims?dimTh(J&&J.dims):null})).join('');}
function resolveSlide(r){                                         // ONE string column's resolution: the source table with
  // that column highlighted, then (connected) the "<type> (wikipedia)" table with its `name` column highlighted to
  // match, and a "Resolving <col>… -> Resolved <col>" status line (the prompt stays in the badge).
  const src=INPUTS.find(t=>slug(t.name)===r.table)||INPUTS.find(t=>(t.cols||[]).includes(r.column))||INPUTS[0];
  const a=src?tableBubble(src.cols,src.rows,src.name,{thExtra:dimTh(J&&J.dims),hlcol:r.column}):'';
  const status=statusBubble('Resolving '+(r.column||'')+'…','Resolved '+(r.column||''));
  if(r.unconnected||!r.columns) return a+status;                 // unconnected free-text column -> embedded as a vector, no table
  return a+tableBubble(r.columns||[],r.rows||[],(r.wtable||'')+' (wikipedia)',{hlcol:r.hlcol||'name'})+status;
}
function statusBubble(progressText,doneText){                     // a step's progress/completion line (the badge stays the prompt)
  const done=SETTLED||(S<LAST);                                   // done once the run settled OR a later slide superseded this one
  return '<div class=bubble><div class=qbub>'+esc(done?doneText:progressText)+'</div></div>';
}
function loadingSlide(msg){$('badge').textContent=question;
  $('gridcard').innerHTML=inputBubbles(false)+'<div class=bubble><div class=qbub>'+esc('Analyzing input…')+'</div></div>';}
function buildTicks(){const t=$('ticks');t.innerHTML='';for(let i=0;i<=LAST;i++)t.insertAdjacentHTML('beforeend','<div class=tick></div>');}

const ENDPOINT=API_BASE+'/api/world';
async function run(){
  INPUTS=SHEETS.map(s=>{const p=parseCSV(s.data);return {name:s.name,cols:p.cols,rows:p.rows};}); loadingSlide('Resolving to the world…');
  let token;
  try{ token=await window.ensureToken(); }                         // Google sign-in (redirect if not already signed in)
  catch(e){ fail('sign-in required to run on your data: '+(e&&e.message||e)); return; }
  const uid=window.__uid;
  const jobId=(crypto&&crypto.randomUUID)?crypto.randomUUID():(Date.now()+'-'+Math.random().toString(36).slice(2));
  // (1) kick off the job FIRE-AND-FORGET: the answer arrives via RTDB, not this response. A cold-start 503/HTML or a
  // 60s proxy timeout on a slow lazy Wikidata fill is harmless — we never await the body on the streaming path. We KEEP
  // the promise so the FALLBACK can await it if RTDB never reports a status.
  const httpPromise=fetch(ENDPOINT,{method:'POST',headers:{'content-type':'application/json','Authorization':'Bearer '+token},
                                    body:JSON.stringify({tables:SHEETS,question:question,jobId:jobId})}).catch(()=>null);
  // (2) subscribe to the live trace. Streamed views -> appendView (view mode); status drives the thinking/lock states.
  if(uid&&window.subscribeRun){
    UNSUB=window.subscribeRun(uid,jobId,{
      onStatus:st=>{ if(SETTLED)return;
        if(st==='resolving'&&!VIEWS.length&&!RESOLVES.length) loadingSlide('Resolving to the world…');
        else if(st==='running'&&!VIEWS.length&&!RESOLVES.length) loadingSlide('Joining to world knowledge…');
        else if(st==='done') markDone(); },
      onResolve:(k,r)=>{ if(SETTLED||!r||typeof r!=='object'||!r.column||SEEN_R.has(k))return; SEEN_R.add(k); appendResolve(r); if(DONE)markDone(); },  // only valid per-column slides (ignore stale flat-map strings)
      onView:(k,v)=>{ if(SETTLED||!v||SEEN.has(k))return; SEEN.add(k); appendView(v); if(DONE)markDone(); },
      onResult:r=>{ if(SETTLED)return; J=J||{}; J.result=r; if(DONE)markDone(); },
      onClarify:c=>{ if(SETTLED)return; goClarify(Object.assign({question:question},c)); },
      onError:e=>{ if(SETTLED)return; fail(e||'the model reported an error'); settle(); },
    });
  }
  // (3) FALLBACK: if RTDB never reports a status within ~90s (RTDB down, or backend not streaming), AWAIT the HTTP
  // body and render from the full JSON exactly as before — the endpoint still returns {sql, result, dims, clarify}.
  setTimeout(async()=>{
    if(SETTLED||DONE||VIEWS.length)return;
    let j=null;
    for(let attempt=1; attempt<=5 && !j && !SETTLED && !DONE; attempt++){          // cold-start retry on the fallback path
      try{
        const r=attempt===1?await httpPromise:await fetch(ENDPOINT,{method:'POST',headers:{'content-type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({tables:SHEETS,question:question,jobId:jobId})});
        if(r&&r.ok){ const txt=await r.text(); if(txt.trim().charAt(0)==='{'){ j=JSON.parse(txt); break; } }
      }catch(e){}
      loadingSlide('Warming up the model (~1 min on first use)…');
      await new Promise(res=>setTimeout(res, attempt<=2?5000:9000));
    }
    if(SETTLED||DONE||VIEWS.length)return;
    if(!j){ fail('the model is still warming up — please reload in a moment'); return; }
    renderFromJSON(j);
  },90000);
}
// a streamed view landed -> view mode: append it, grow the slider, auto-advance unless the user is driving.
function appendView(v){
  VIEW_MODE=true; VIEWS.push(v); J=J||{}; J.views=VIEWS; if(v.sql&&!J.sql)J.sql=v.sql;
  LAST=RESOLVES.length+VIEWS.length; READY=true; buildTicks(); fillInfo();
  if(AUTO){ stopPlay(); render(LAST); } else render(S);
}
// one resolution slide arrived (a string column resolved to its world table) -> insert it after Input, before the steps.
function appendResolve(r){
  RESOLVES.push(r);
  LAST=RESOLVES.length+VIEWS.length; READY=true; buildTicks();
  if(AUTO){ stopPlay(); render(RESOLVES.length); } else render(S);
}
// status=done: mark finished, then settle on a short delay so a trailing view child (RTDB may deliver the last view
// AFTER the status value) still lands before we lock + tear down the subscription.
function markDone(){ if(SETTLED)return; DONE=true; clearTimeout(doneTimer); doneTimer=setTimeout(finalize,400); }
function finalize(){
  if(SETTLED)return; settle(); fillInfo();
  if(VIEW_MODE){                                                  // make the last streamed view the authoritative answer
    if(J&&J.result&&J.result.rows){ const lv=VIEWS[VIEWS.length-1]; lv.columns=J.result.columns||lv.columns; lv.rows=J.result.rows||lv.rows; }
    LAST=RESOLVES.length+VIEWS.length; READY=true; buildTicks(); if(AUTO){render(LAST);} else render(S);
  } else {                                                        // single-result delegate: build the SQL-forming animation from j.sql
    buildSqlSteps(); if(AUTO){startPlay();} else render(S);
  }
}
// fallback path: the full JSON arrived. Render via the SQL-forming animation (or views if the engine returned a stack).
function renderFromJSON(j){
  if(SETTLED)return;
  if(j.clarify){ goClarify(Object.assign({question:question},j)); return; }
  if(j.error){ fail(j.error); settle(); return; }
  settle();
  J=j; DONE=true; fillInfo();
  if((j.views||[]).length>1){ VIEW_MODE=true; VIEWS=j.views; LAST=RESOLVES.length+VIEWS.length; READY=true; buildTicks(); startPlay(); }
  else { buildSqlSteps(); startPlay(); }
}
function buildSqlSteps(){                                          // the world-join SQL forming token-by-token (the signature view)
  TOKS=sqlTokens((J&&J.sql)||'');
  REVEAL=[]; TOKS.forEach((tk,i)=>{const u=tk.toUpperCase();if(i>0&&(u==='JOIN'||u==='WHERE'||u==='ORDER'||u==='GROUP'))REVEAL.push(i);});
  REVEAL.push(TOKS.length); REVEAL=[...new Set(REVEAL)].sort((a,b)=>a-b);   // a beat per JOIN / WHERE / ORDER / GROUP
  LAST=RESOLVES.length+REVEAL.length+1; READY=true; buildTicks();
}
function settle(){ SETTLED=true; clearTimeout(doneTimer); if(UNSUB){try{UNSUB();}catch(_){}UNSUB=null;} }
function goClarify(c){ settle(); try{ sessionStorage.setItem(SS.CLARIFY,JSON.stringify(c)); }catch(_){}; location.href='clarify'; }
function render(slide){
  if(!READY)return; S=Math.max(0,Math.min(LAST,+slide));
  $('fill').style.width=(S/LAST*100)+'%'; $('knob').style.left=(S/LAST*100)+'%';
  const nR=RESOLVES.length; let h;                               // the badge stays the PROMPT for every slide (set below)
  if(S===0){ h=inputBubbles(true)+statusBubble('Analyzing input…','Analyzed input'); }
  else if(S<=nR){ h=resolveSlide(RESOLVES[S-1]); }
  else if(VIEW_MODE){                                             // streamed view stack: each step shows its table (and SQL on hover)
    const v=VIEWS[S-nR-1], isResult=(S===LAST)&&SETTLED, stepping=(S===LAST)&&!SETTLED;
    h = tableBubble(v.columns||[],v.rows||[],isResult?'Result':(v.label||oplabel(v.op)))
      + (stepping?'<div class=bubble><div class=think>'+SPINNER+' '+esc('Reasoning…')+'</div></div>':'');
  }
  else if(S===LAST){ h=tableBubble((J&&J.result&&J.result.columns)||[],(J&&J.result&&J.result.rows)||[],'Result'); }
  else { h=sqlToksBubble(REVEAL[S-nR-1]); }
  $('badge').textContent=question; $('gridcard').innerHTML=h;
}
function drive(){AUTO=false;}                                      // the user took the wheel -> stop auto-advancing to new views
function step(d){drive();stopPlay();render(S+d);}
function scrubClick(e){if(!READY)return;drive();stopPlay();const r=$('scrub').getBoundingClientRect();render(Math.round((e.clientX-r.left)/r.width*LAST));}
function togglePlay(){if(!READY)return;drive();playTimer?stopPlay():startPlay();}
function startPlay(){if(!READY)return;$('play').innerHTML=PAUSE;let s=0;render(0);const dt=Math.max(950,Math.round(4400/(LAST||1)));
  playTimer=setInterval(()=>{s++;if(s>LAST){stopPlay();return}render(s);},dt);}
function stopPlay(){if(playTimer){clearInterval(playTimer);playTimer=null}$('play').innerHTML=PLAY;}
try{ fetch(ENDPOINT,{method:'GET',cache:'no-store'}).catch(()=>{}); }catch(_){}   // pre-warm the scale-to-zero world service
</script>
