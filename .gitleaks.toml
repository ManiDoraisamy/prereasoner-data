title = "Prereasoner secret scanning"

[extend]
useDefault = true

# gitleaks 8.24 (the version gitleaks-action v3 installs) reads one global [allowlist], whose entries each allow a
# finding on their own; it does not read the [[allowlists]] tables of 8.25 and later, so the weight manifest's digests
# were flagged at deed02f although an exemption for them was written (2026-10-22).
[allowlist]
description = "Public client configuration (Firebase and Picker browser identifiers, which server authorization never trusts), and a line mapping a file name to its public SHA-256, as the weight manifest does: a tokenizer file's name is no credential."
paths = ['''^web/public/lib/config\.js$''']
regexTarget = "line"
regexes = ['''^\+?\s*"[A-Za-z0-9_./-]+\.[a-z]+": "[0-9a-f]{64}",?\s*$''']
