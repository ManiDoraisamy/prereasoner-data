# Product acceptance suite against a disposable seeded Postgres container. Never uses Cloud SQL.
steps:
  - id: live-product-suite
    name: gcr.io/cloud-builders/docker@sha256:e85f8f20f7b533e74a4b1be279b9ff2b45dcc20ab97de9b302c26715a9d9ffc8
    entrypoint: bash
    args:
      - -ceu
      - |
        export BASE_IMAGE='${_BASE_IMAGE}'
        export PGVECTOR_IMAGE='${_PGVECTOR_IMAGE}'
        export BUILD_ID='${BUILD_ID}'
        exec bash /workspace/deploy/gcp/run_product_suite.sh

substitutions:
  _BASE_IMAGE: us-central1-docker.pkg.dev/prereasoner-inference/prereasoner/engine@sha256:57d49a5da4e5ec2fa03881969e9424bb5032584aaf94bc581b6bbfc74aeb8482
  _PGVECTOR_IMAGE: pgvector/pgvector:pg16@sha256:eac621400b7b7ff52493883e41e930e3d104695fea5b68cc0c42370cf7880067

options:
  # The E2_HIGHCPU_8 worker has only 8 GB host memory, less than this lane's
  # 16 GB model-test container plus the database. Use the 32 GB worker to avoid
  # host-level SIGKILLs while preserving the container's 8-vCPU/16-GiB serving cap.
  machineType: E2_HIGHCPU_32

timeout: 5400s
