<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Spreadsheet question with inspectable calculation</title>
  <desc id="desc">A minimal Google Sheets-style grid with two highlighted France rows beside an add-on sidebar showing the question, answer, and sum of those rows.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #202124; }
      .muted { fill: #4b5563; }
      .sheet-name { font-size: 32px; font-weight: 700; fill: #188038; }
      .table-head { font-size: 28px; font-weight: 700; fill: #137333; }
      .cell { font-size: 32px; }
      .label { font-size: 26px; font-weight: 700; }
      .question { font-size: 36px; font-weight: 600; }
      .answer { font-size: 64px; font-weight: 700; }
      .calculation { font-size: 36px; font-weight: 600; }
    </style>
  </defs>

  <rect width="1280" height="800" fill="#f5f6fb"/>

  <!-- Sheet and add-on sit together as they do in Google Sheets. -->
  <rect x="28" y="24" width="752" height="752" fill="#fff" stroke="#dadce0" stroke-width="2"/>
  <rect x="28" y="24" width="752" height="8" fill="#188038"/>
  <rect x="52" y="53" width="42" height="42" rx="5" fill="#188038"/>
  <path d="M62 64h22M62 73h22M62 82h22M69 64v18M77 64v18" stroke="#fff" stroke-width="2"/>
  <text x="108" y="86" class="sheet-name">Sales data</text>

  <rect x="52" y="118" width="704" height="72" fill="#e6f4ea"/>
  <path d="M365 118v574M550 118v574M52 190h704M52 316h704M52 442h704M52 568h704M52 694h704" stroke="#d7e2d9" stroke-width="2"/>
  <text x="76" y="164" class="table-head">Country</text>
  <text x="457" y="164" text-anchor="middle" class="table-head">Quarter</text>
  <text x="728" y="164" text-anchor="end" class="table-head">Sales</text>

  <rect x="52" y="192" width="704" height="122" fill="#f1f8f3"/>
  <rect x="52" y="318" width="704" height="122" fill="#f1f8f3"/>
  <rect x="52" y="192" width="8" height="248" fill="#34a853"/>
  <text x="76" y="267" class="cell">France</text>
  <text x="457" y="267" text-anchor="middle" class="cell">Q3</text>
  <text x="728" y="267" text-anchor="end" class="cell" font-weight="700">$840</text>
  <text x="76" y="393" class="cell">France</text>
  <text x="457" y="393" text-anchor="middle" class="cell">Q3</text>
  <text x="728" y="393" text-anchor="end" class="cell" font-weight="700">$400</text>
  <text x="76" y="519" class="cell">Germany</text>
  <text x="457" y="519" text-anchor="middle" class="cell">Q3</text>
  <text x="728" y="519" text-anchor="end" class="cell">$620</text>
  <text x="76" y="645" class="cell">Spain</text>
  <text x="457" y="645" text-anchor="middle" class="cell">Q3</text>
  <text x="728" y="645" text-anchor="end" class="cell">$260</text>

  <rect x="780" y="24" width="472" height="752" fill="#fff" stroke="#dadce0" stroke-width="2"/>
  <rect x="780" y="24" width="472" height="10" fill="#6f4bf2"/>
  <rect x="808" y="62" width="416" height="156" rx="12" fill="#f3f0ff"/>
  <text x="832" y="124" class="question">What were Q3</text>
  <text x="832" y="171" class="question">sales in France?</text>

  <text x="808" y="294" class="label muted">ANSWER</text>
  <text x="808" y="348" font-size="30">France · Q3 total</text>
  <text x="808" y="439" class="answer">$1,240</text>
  <path d="M808 488h416" stroke="#e1e3eb" stroke-width="2"/>
  <text x="808" y="543" class="label muted">CALCULATION</text>
  <text x="808" y="608" class="calculation">$840 + $400</text>
</svg>
