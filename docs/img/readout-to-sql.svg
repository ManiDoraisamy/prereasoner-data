<svg viewBox="0 0 680 916" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>How PreReasoner turns a prompt into SQL</title>
  <desc>The transformer's last layer is a units-by-anchors activation matrix, not SQL tokens; a deterministic search assembles a typed AST parse tree from it, which is then rendered to a SQL string.</desc>
  <rect x="0" y="0" width="680" height="916" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1,1 L7,4.5 L1,8" fill="none" stroke="#8b949e" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect x="230" y="16" width="220" height="34" rx="8" fill="#f1f3f5" stroke="#868e96" stroke-width="1.2"/>
  <text x="340" y="38" text-anchor="middle" font-size="14" fill="#1f2328" font-family="ui-monospace, monospace">"total amount in France"</text>
  <line x1="340" y1="50" x2="340" y2="70" stroke="#8b949e" stroke-width="1.4" marker-end="url(#ar)"/>

  <rect x="150" y="72" width="380" height="46" rx="8" fill="#e7f0fe" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="340" y="92" text-anchor="middle" font-size="13" font-weight="500" fill="#1f2328">Qwen2.5-0.5B + LoRA  &#8594;  relational readout</text>
  <text x="340" y="109" text-anchor="middle" font-size="11.5" fill="#1f2328">one node per schema column + one per question word &#183; 11 layers</text>
  <line x1="340" y1="118" x2="340" y2="138" stroke="#8b949e" stroke-width="1.4" marker-end="url(#ar)"/>

  <text x="340" y="153" text-anchor="middle" font-size="14" font-weight="500" fill="#1f2328">The last layer &#8212; an activation matrix, not SQL tokens</text>
  <text x="340" y="170" text-anchor="middle" font-size="11.5" fill="#57606a">rows = units (columns + words) &#183; cols = the 90 schema.org property + 10 intent anchors</text>

  <text x="250" y="196" text-anchor="middle" font-size="10.5" fill="#57606a">monetary</text>
  <text x="330" y="196" text-anchor="middle" font-size="10.5" fill="#57606a">place</text>
  <text x="412" y="196" text-anchor="middle" font-size="10.5" fill="#57606a">intent:SUM</text>
  <text x="500" y="196" text-anchor="middle" font-size="10.5" fill="#57606a">filter:=</text>
  <text x="200" y="222" text-anchor="end" font-size="12" fill="#1f2328" font-family="ui-monospace, monospace">amount</text>
  <text x="200" y="250" text-anchor="end" font-size="12" fill="#1f2328" font-family="ui-monospace, monospace">city</text>
  <text x="200" y="278" text-anchor="end" font-size="12" fill="#1f2328" font-family="ui-monospace, monospace">total&#183;w</text>
  <text x="200" y="306" text-anchor="end" font-size="12" fill="#1f2328" font-family="ui-monospace, monospace">France&#183;w</text>

  <rect x="210" y="206" width="330" height="112" rx="4" fill="none" stroke="#d0d7de"/>
  <line x1="210" y1="234" x2="540" y2="234" stroke="#d0d7de"/>
  <line x1="210" y1="262" x2="540" y2="262" stroke="#d0d7de"/>
  <line x1="210" y1="290" x2="540" y2="290" stroke="#d0d7de"/>
  <line x1="292" y1="206" x2="292" y2="318" stroke="#d0d7de"/>
  <line x1="373" y1="206" x2="373" y2="318" stroke="#d0d7de"/>
  <line x1="455" y1="206" x2="455" y2="318" stroke="#d0d7de"/>

  <rect x="212" y="208" width="78" height="24" rx="3" fill="#d9f2ec" stroke="#0d9488" stroke-width="1.1"/>
  <rect x="294" y="236" width="78" height="24" rx="3" fill="#d9f2ec" stroke="#0d9488" stroke-width="1.1"/>
  <rect x="376" y="264" width="78" height="24" rx="3" fill="#d9f2ec" stroke="#0d9488" stroke-width="1.1"/>
  <rect x="457" y="292" width="80" height="24" rx="3" fill="#d9f2ec" stroke="#0d9488" stroke-width="1.1"/>
  <text x="251" y="224" text-anchor="middle" font-size="11" font-weight="500" fill="#1f2328">.94</text>
  <text x="333" y="224" text-anchor="middle" font-size="11" fill="#8b949e">.02</text>
  <text x="414" y="224" text-anchor="middle" font-size="11" fill="#8b949e">.05</text>
  <text x="497" y="224" text-anchor="middle" font-size="11" fill="#8b949e">.01</text>
  <text x="251" y="252" text-anchor="middle" font-size="11" fill="#8b949e">.03</text>
  <text x="333" y="252" text-anchor="middle" font-size="11" font-weight="500" fill="#1f2328">.91</text>
  <text x="414" y="252" text-anchor="middle" font-size="11" fill="#8b949e">.00</text>
  <text x="497" y="252" text-anchor="middle" font-size="11" fill="#8b949e">.04</text>
  <text x="251" y="280" text-anchor="middle" font-size="11" fill="#8b949e">.06</text>
  <text x="333" y="280" text-anchor="middle" font-size="11" fill="#8b949e">.01</text>
  <text x="414" y="280" text-anchor="middle" font-size="11" font-weight="500" fill="#1f2328">.88</text>
  <text x="497" y="280" text-anchor="middle" font-size="11" fill="#8b949e">.09</text>
  <text x="251" y="308" text-anchor="middle" font-size="11" fill="#8b949e">.00</text>
  <text x="333" y="308" text-anchor="middle" font-size="11" fill="#8b949e">.31</text>
  <text x="414" y="308" text-anchor="middle" font-size="11" fill="#8b949e">.07</text>
  <text x="497" y="308" text-anchor="middle" font-size="11" font-weight="500" fill="#1f2328">.86</text>

  <line x1="340" y1="330" x2="340" y2="350" stroke="#8b949e" stroke-width="1.4" marker-end="url(#ar)"/>

  <rect x="120" y="352" width="440" height="44" rx="8" fill="#f1f3f5" stroke="#868e96" stroke-width="1.2"/>
  <text x="340" y="371" text-anchor="middle" font-size="12.5" font-weight="500" fill="#1f2328">read off the matrix &#8594; roles</text>
  <text x="340" y="388" text-anchor="middle" font-size="11.5" fill="#1f2328" font-family="ui-monospace, monospace">aggregate:SUM&#8594;amount &#183; filter&#8594;France &#183; projection:&#8709; &#183; group:&#8709;</text>
  <line x1="340" y1="396" x2="340" y2="416" stroke="#8b949e" stroke-width="1.4" marker-end="url(#ar)"/>

  <rect x="170" y="418" width="340" height="42" rx="8" fill="#fdf0d5" stroke="#d97706" stroke-width="1.2"/>
  <text x="340" y="438" text-anchor="middle" font-size="12.5" font-weight="500" fill="#1f2328">deterministic typed-AST search</text>
  <text x="340" y="453" text-anchor="middle" font-size="11" fill="#1f2328">bounded beam &#183; builds + scores candidate trees &#183; no token sampling</text>
  <line x1="340" y1="460" x2="340" y2="480" stroke="#8b949e" stroke-width="1.4" marker-end="url(#ar)"/>

  <text x="340" y="496" text-anchor="middle" font-size="14" font-weight="500" fill="#1f2328">A typed AST &#8212; a parse tree of dataclass nodes</text>

  <rect x="278" y="508" width="124" height="30" rx="6" fill="#fdf0d5" stroke="#d97706" stroke-width="1.2"/>
  <text x="340" y="527" text-anchor="middle" font-size="12" font-weight="500" fill="#1f2328">SelectQuery</text>
  <text x="418" y="527" font-size="10.5" fill="#57606a">from = orders</text>

  <line x1="310" y1="538" x2="200" y2="566" stroke="#8b949e" stroke-width="1.2"/>
  <line x1="370" y1="538" x2="470" y2="566" stroke="#8b949e" stroke-width="1.2"/>
  <text x="250" y="556" font-size="10" fill="#8b949e">select</text>
  <text x="440" y="556" font-size="10" fill="#8b949e">where</text>

  <rect x="140" y="566" width="120" height="28" rx="6" fill="#f1f3f5" stroke="#868e96" stroke-width="1.2"/>
  <text x="200" y="584" text-anchor="middle" font-size="11" fill="#1f2328">SelectItem</text>
  <line x1="200" y1="594" x2="200" y2="612" stroke="#8b949e" stroke-width="1.2"/>
  <rect x="132" y="612" width="136" height="28" rx="6" fill="#f1f3f5" stroke="#868e96" stroke-width="1.2"/>
  <text x="200" y="630" text-anchor="middle" font-size="11" fill="#1f2328">Aggregate "SUM"</text>
  <line x1="200" y1="640" x2="200" y2="658" stroke="#8b949e" stroke-width="1.2"/>
  <rect x="124" y="658" width="152" height="28" rx="6" fill="#f1f3f5" stroke="#868e96" stroke-width="1.2"/>
  <text x="200" y="676" text-anchor="middle" font-size="10.5" fill="#1f2328" font-family="ui-monospace, monospace">ColumnRef amount</text>

  <rect x="410" y="566" width="120" height="28" rx="6" fill="#f1f3f5" stroke="#868e96" stroke-width="1.2"/>
  <text x="470" y="584" text-anchor="middle" font-size="11" fill="#1f2328">Comparison "="</text>
  <line x1="450" y1="594" x2="410" y2="622" stroke="#8b949e" stroke-width="1.2"/>
  <line x1="490" y1="594" x2="530" y2="622" stroke="#8b949e" stroke-width="1.2"/>
  <rect x="344" y="622" width="130" height="28" rx="6" fill="#f1f3f5" stroke="#868e96" stroke-width="1.2"/>
  <text x="409" y="640" text-anchor="middle" font-size="10.5" fill="#1f2328" font-family="ui-monospace, monospace">ColumnRef country</text>
  <rect x="486" y="622" width="118" height="28" rx="6" fill="#f1f3f5" stroke="#868e96" stroke-width="1.2"/>
  <text x="545" y="640" text-anchor="middle" font-size="10.5" fill="#1f2328" font-family="ui-monospace, monospace">Literal 'France'</text>

  <line x1="340" y1="696" x2="340" y2="716" stroke="#8b949e" stroke-width="1.4" marker-end="url(#ar)"/>

  <rect x="86" y="718" width="508" height="42" rx="8" fill="#dcf3e3" stroke="#16a34a" stroke-width="1.2"/>
  <text x="340" y="744" text-anchor="middle" font-size="12.5" fill="#1f2328" font-family="ui-monospace, monospace">SELECT SUM("amount") FROM "orders" WHERE "country" = 'France'</text>

  <rect x="60" y="784" width="560" height="60" rx="8" fill="#e7f0fe" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="340" y="806" text-anchor="middle" font-size="12.5" font-weight="500" fill="#1f2328">The model TYPES and reads INTENT; a deterministic search ASSEMBLES the tree.</text>
  <text x="340" y="826" text-anchor="middle" font-size="11.5" fill="#1f2328">No autoregressive SQL tokens &#8212; every node is an inspectable dataclass, every choice has evidence.</text>
  <text x="340" y="864" text-anchor="middle" font-size="10.5" fill="#8b949e">"France" is a world value (not in the upload), so it adds a city&#8594;country resolution step &#8212; same readout, world view-stack.</text>
</svg>
